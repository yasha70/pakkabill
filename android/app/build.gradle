// PakkaBill for Android: a Trusted Web Activity that opens https://pakkabill1.vercel.app full
// screen in Chrome (no address bar), so the app gets every feature of the website: bills, PDF and
// Excel downloads, UPI, notifications and offline use. The release APK is built unsigned by
// GitHub Actions (.github/workflows/android.yml) and signed outside the repo; the key's
// fingerprint is in /.well-known/assetlinks.json.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pakkabill.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pakkabill.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
