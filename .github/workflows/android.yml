# Builds PakkaBill for Android (android/): runs the engine tests (the P&L, billing and the website's
# tool engines the app is built with), then the Play Store bundle (.aab) and the website APK, both
# unsigned (the signing key stays outside this public repo), plus a debug APK that is tested on an
# Android emulator with screenshots. On main, outputs go to the apk-build and apk-shots branches;
# a run started by hand on another branch keeps them as the run's artifacts only.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'pnl.html'
      - '.github/workflows/android.yml'
      # the website files the app's tool engines are built from (android/engines/build.mjs)
      - 'labels.html'
      - 'index.html'
      - 'gstr1check.js'
      - 'gstr1view.js'
      - 'lowship.js'
      - 'listing.js'
      - 'autolist.js'
      - 'lens/**'
      - 'test/*-audit.js'
      - 'test/autolist-form.html'

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      # the website's tool engines are built for the app with Node (android/engines)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build bundle, release APK and debug APK
        working-directory: android
        env:
          AUTOLIST_WEB_OUT: ${{ runner.temp }}/autolist-web.js
          SHIP_WEB_OUT: ${{ runner.temp }}/ship-web.js
        run: gradle :core:test :app:bundleRelease :app:assembleRelease :app:assembleDebug --stacktrace

      - name: The app's scripts for Meesho's pages (Auto listing, shipping check), in Chromium (the engine of Android's WebView)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null && npm i playwright@1.63.0 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node "$GITHUB_WORKSPACE/android/ci/autolist-web-check.cjs" "$RUNNER_TEMP/autolist-web.js"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node "$GITHUB_WORKSPACE/android/ci/ship-web-check.cjs" "$RUNNER_TEMP/ship-web.js"

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/PakkaBill-unsigned.aab
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/PakkaBill-unsigned.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/PakkaBill-debug.apk
          cp android/app/build/outputs/mapping/release/mapping.txt out/mapping.txt || true
          echo "Built from ${GITHUB_SHA}" > out/README.txt
          echo '{"git":{"deploymentEnabled":false}}' > out/vercel.json
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: PakkaBill-android
          path: out/

      - name: Push outputs to the apk-build branch
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b apk-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Android build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-build

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PakkaBill-android
          path: apk-all

      - name: Debug APK, and the release APK signed with a throwaway test key
        run: |
          mkdir -p apk rel
          cp apk-all/PakkaBill-debug.apk apk/
          keytool -genkeypair -keystore ci.jks -storepass android -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=CI test"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks ci.jks --ks-pass pass:android --out rel/PakkaBill-release-test.apk apk-all/PakkaBill-unsigned.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/shots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PakkaBill-shots
          path: shots/

      - name: Push screenshots to the apk-shots branch
        if: always() && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p shots && cd shots
          echo "Tested ${GITHUB_SHA}" > README.txt
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b apk-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Emulator screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-shots
