# Builds PakkaBill for Android (android/): the Play Store bundle (.aab) and the website APK, both
# unsigned (the signing key stays outside this public repo), plus a debug APK that is tested on an
# Android emulator with screenshots. Outputs go to the apk-build and apk-shots branches.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build bundle, release APK and debug APK
        working-directory: android
        run: gradle :app:bundleRelease :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/PakkaBill-unsigned.aab
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/PakkaBill-unsigned.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/PakkaBill-debug.apk
          cp android/app/build/outputs/mapping/release/mapping.txt out/mapping.txt || true
          echo "Built from ${GITHUB_SHA}" > out/README.txt
          echo '{"git":{"deploymentEnabled":false}}' > out/vercel.json
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: PakkaBill-android
          path: out/

      - name: Push outputs to the apk-build branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b apk-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Android build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-build

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PakkaBill-android
          path: apk-all

      - name: Keep only the debug APK
        run: mkdir -p apk && cp apk-all/PakkaBill-debug.apk apk/ && pip install --quiet websocket-client

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/shots.sh

      - name: Push screenshots to the apk-shots branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p shots && cd shots
          echo "Tested ${GITHUB_SHA}" > README.txt
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b apk-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Emulator screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-shots
