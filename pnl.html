<!DOCTYPE html>
<html lang="en-IN">
<head>

<title>Hisaab: Meesho P&amp;L and reconciliation</title>
<script>(function () { try { if (/[?&]embed=1(&|$)/.test(location.search)) document.documentElement.classList.add('embed'); } catch (e) { /* ignore */ } })();</script>
<style>
:root {
  --paper: #F6F7FB; --sheet: #FFFFFF; --rule: #DCE1F0; --rule-2: #B9C1DD;
  --ink: #1B1F3B; --ink-2: #4A5074; --ink-3: #6F7599;
  --carbon: #2F3490; --carbon-ink: #FFFFFF; --carbon-soft: #E8E9F8; --band: #2F3490;
  --margin: #C8323A; --neg: #B42331; --pos: #16774A; --warn: #8A5200; --warn-bg: #FFF4DF;
  --focus: #5A61E6;
  --f-head: "Anek Latin", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-deva: "Anek Devanagari", "Nirmala UI", "Mangal", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1122; --sheet: #161933; --rule: #2A2F55; --rule-2: #3B4170;
    --ink: #E7E9F7; --ink-2: #B7BBDA; --ink-3: #8F94BA;
    --carbon: #8E95FF; --carbon-ink: #0F1122; --carbon-soft: #232858; --band: #1D2168;
    --margin: #FF6B74; --neg: #FF7A84; --pos: #4CD08F; --warn: #F0B45A; --warn-bg: #2B2410;
    --focus: #A9AEFF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1122; --sheet: #161933; --rule: #2A2F55; --rule-2: #3B4170;
  --ink: #E7E9F7; --ink-2: #B7BBDA; --ink-3: #8F94BA;
  --carbon: #8E95FF; --carbon-ink: #0F1122; --carbon-soft: #232858; --band: #1D2168;
  --margin: #FF6B74; --neg: #FF7A84; --pos: #4CD08F; --warn: #F0B45A; --warn-bg: #2B2410;
  --focus: #A9AEFF; color-scheme: dark;
}
/* inside PakkaBill: its colours and fonts, no header band (PakkaBill has its own) */
:root.embed {
  --paper: #fdf8f3; --sheet: #FFFFFF; --rule: #e2daf2; --rule-2: #cfc4ea;
  --ink: #2a2540; --ink-2: #5c5776; --ink-3: #736e8d;
  --carbon: #5b3fe6; --carbon-ink: #FFFFFF; --carbon-soft: #ece6ff;
  --margin: #c8202a; --neg: #c8202a; --pos: #12714b; --warn: #b26a00; --warn-bg: #fff4df; --focus: #ff7a59;
}
@media (prefers-color-scheme: dark) {
  :root.embed:not([data-theme="light"]) {
    --paper: #110e20; --sheet: #1b1631; --rule: #3a3160; --rule-2: #4a4078;
    --ink: #ece8fb; --ink-2: #bdb5d9; --ink-3: #958db3;
    --carbon: #b3a1ff; --carbon-ink: #140c33; --carbon-soft: #35295e;
    --margin: #ff8a8f; --neg: #ff8a8f; --pos: #74d8a7; --warn: #f0c26a; --warn-bg: #2b2410; --focus: #ff7a59;
  }
}
:root.embed[data-theme="dark"] {
  --paper: #110e20; --sheet: #1b1631; --rule: #3a3160; --rule-2: #4a4078;
  --ink: #ece8fb; --ink-2: #bdb5d9; --ink-3: #958db3;
  --carbon: #b3a1ff; --carbon-ink: #140c33; --carbon-soft: #35295e;
  --margin: #ff8a8f; --neg: #ff8a8f; --pos: #74d8a7; --warn: #f0c26a; --warn-bg: #2b2410; --focus: #ff7a59;
}
:root.embed.pbfonts { --f-head: "PB Hind", "Hind", system-ui, -apple-system, "Segoe UI", sans-serif; --f-body: "PB Hind", "Hind", system-ui, -apple-system, "Segoe UI", sans-serif; }
.embed .band { display: none; }
.embed .tabs { top: 0; }
.embed .only-own { display: none; }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 56px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--f-body); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.2; margin: 0; }
h2 { font-size: 1.3rem; font-weight: 650; }
h3 { font-size: 1.05rem; font-weight: 650; }
p { margin: 0 0 .6em; }
a { color: var(--carbon); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-3); }
.small { font-size: .875rem; }
.neg { color: var(--neg); }
.pos { color: var(--pos); }

/* header band */
.band { background: var(--band); color: #fff; padding: 14px 16px 12px; }
.band-in { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.mark { font-family: var(--f-deva); font-weight: 600; font-size: 1.9rem; line-height: 1; letter-spacing: .01em; }
.brand { display: flex; flex-direction: column; }
.brand b { font-family: var(--f-head); font-weight: 600; font-size: 1.05rem; line-height: 1.1; }
.brand span { font-size: .82rem; opacity: .82; }
.band-biz { margin-left: auto; text-align: right; font-size: .82rem; opacity: .9; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.tabs-in { max-width: 860px; margin: 0 auto; display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 8px; }
.tabs-in::-webkit-scrollbar { display: none; }
.tab { flex: none; background: none; border: 0; padding: 13px 12px 11px; font-weight: 600; font-size: .95rem; color: var(--ink-3); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--carbon); }
.tab .dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--margin); color: #fff; font-size: .72rem; line-height: 18px; text-align: center; }

main { max-width: 860px; margin: 0 auto; padding: 16px 14px 48px; }
.panel[hidden] { display: none; }
.stack > * + * { margin-top: 14px; }

.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: 16px; }
.sheet-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.sheet-h p { margin: 0; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--rule-2); background: var(--sheet); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--carbon); }
.btn.pri { background: var(--carbon); border-color: var(--carbon); color: var(--carbon-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sm { min-height: 34px; padding: 4px 10px; font-size: .88rem; }
.btn.link { border: 0; background: none; color: var(--carbon); padding: 4px 2px; min-height: 0; text-decoration: underline; text-underline-offset: 2px; }
.btn.danger { color: var(--neg); }
.btn[disabled] { opacity: .55; cursor: progress; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 auto; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .88rem; color: var(--ink-2); font-weight: 600; }
.inp, select.inp { min-height: 42px; padding: 8px 10px; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--sheet); width: 100%; }
.inp.money { text-align: right; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 8px 12px; min-height: 40px; font-weight: 600; font-size: .9rem; color: var(--ink-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule-2); }
.seg button[aria-pressed="true"] { background: var(--carbon); color: var(--carbon-ink); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .95rem; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--carbon); }
.fgrid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .fgrid { grid-template-columns: 1fr 1fr; } }

/* data steps */
.steps { list-style: none; counter-reset: st; margin: 0; padding: 0; }
.steps li { counter-increment: st; position: relative; padding: 0 0 14px 44px; }
.steps li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--carbon); color: var(--carbon); font: 700 .95rem/27px var(--f-head); text-align: center; }
.steps li.done::before { background: var(--carbon); color: var(--carbon-ink); content: "\2713"; }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 14.5px; top: 34px; bottom: 4px; width: 1px; background: var(--rule-2); }
.steps .st { display: block; font-family: var(--f-head); font-weight: 600; }
.steps p { margin: 2px 0 0; color: var(--ink-2); font-size: .95rem; }
.drop { display: block; border: 2px dashed var(--rule-2); border-radius: 8px; padding: 22px 16px; text-align: center; cursor: pointer; background: var(--paper); }
.drop:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.drop:hover, .drop.over { border-color: var(--carbon); background: var(--carbon-soft); }
.drop b { display: block; font-family: var(--f-head); font-size: 1.1rem; }
.file { border-top: 1px solid var(--rule); padding: 12px 0; }
.file:first-child { border-top: 0; }
.file-h { display: flex; gap: 10px; align-items: flex-start; }
.file-h b { word-break: break-all; }
.sheets { margin: 6px 0 0; padding: 0; list-style: none; font-size: .9rem; color: var(--ink-2); }
.sheets li { padding: 2px 0; }
.tick { color: var(--pos); font-weight: 700; }
.cross { color: var(--neg); font-weight: 700; }

/* callouts */
.note { border-left: 3px solid var(--warn); background: var(--warn-bg); padding: 10px 12px; border-radius: 0 6px 6px 0; font-size: .93rem; }
.note.info { border-left-color: var(--carbon); background: var(--carbon-soft); }
.note.bad { border-left-color: var(--neg); }
.note p:last-child { margin: 0; }
.demo-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* period bar */
.period { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .period { grid-template-columns: 1fr auto; align-items: end; } }
.dl { display: flex; gap: 8px; flex-wrap: wrap; }
.dl .btn { flex: 1 1 130px; padding-left: 12px; padding-right: 12px; }
@media (min-width: 620px) { .dl .btn { flex: 0 0 auto; white-space: nowrap; } }

/* KPI slip */
.slip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
.slip > div { background: var(--sheet); padding: 10px 12px; }
.slip .np { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.slip small { display: block; color: var(--ink-3); font-size: .82rem; font-weight: 600; }
.slip strong { font-family: var(--f-head); font-weight: 600; font-size: 1.15rem; }
.slip .np strong { font-size: 1.9rem; line-height: 1.1; }
@media (min-width: 620px) { .slip { grid-template-columns: repeat(4, 1fr); } }

/* returns, RTO and exchanges */
.rv-total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 10px 14px; margin-bottom: 12px; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; font-weight: 600; color: var(--ink-2); }
.rv-total b { font-family: var(--f-head); font-size: 1.4rem; }
.rv-cards { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 620px) { .rv-cards { grid-template-columns: repeat(3, 1fr); } }
.rv-card { --acc: var(--carbon); border: 1px solid var(--rule); border-top: 4px solid var(--acc); border-radius: 6px; padding: 12px 14px; background: var(--sheet); min-width: 0; }
.rv-rto { --acc: var(--warn); } .rv-ret { --acc: var(--neg); } .rv-exch { --acc: var(--carbon); } .rv-lost { --acc: var(--ink-3); }
.rv-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.rv-top b { display: block; font-family: var(--f-head); font-size: 1.1rem; }
.rv-top small { display: block; color: var(--ink-3); font-size: .8rem; }
.rv-top strong { font-family: var(--f-head); font-size: 1.8rem; line-height: 1; color: var(--acc); }
.rv-bar { height: 6px; background: var(--paper); border-radius: 99px; margin: 10px 0 6px; overflow: hidden; }
.rv-bar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; }
.rv-of { margin: 0 0 10px; font-size: .85rem; color: var(--ink-2); }
.rv-money { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dashed var(--rule); padding-top: 10px; font-weight: 600; }
.rv-money b { font-family: var(--f-head); font-size: 1.2rem; }
.rv-per { margin: 2px 0 0; font-size: .8rem; color: var(--ink-3); text-align: right; }
.rv-lines { list-style: none; margin: 8px 0 0; padding: 0; font-size: .85rem; }
.rv-lines li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; color: var(--ink-2); }
.rv-sub { margin-top: 12px; }
.rv-sub > summary { cursor: pointer; font-weight: 600; }
.rv-notes { margin: 8px 0 0; padding-left: 18px; font-size: .85rem; color: var(--ink-3); }
.rv-notes li { margin: 3px 0; }

/* "Know your real profit" banner */
.hero { position: relative; overflow: hidden; border-radius: 14px; padding: 18px 18px 16px; color: #fff; background: linear-gradient(120deg, #2b3494 0%, #5b3fe6 60%, #8a5cf0 100%); display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
.hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(255,122,89,.55), rgba(255,122,89,0) 70%); pointer-events: none; }
.hero-t { position: relative; z-index: 1; max-width: 560px; }
.hero-k { margin: 0 0 4px; font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.hero h1 { margin: 0; font-family: var(--f-head); font-size: 1.7rem; line-height: 1.1; color: #fff; }
.hero.big h1 { font-size: 2.1rem; }
.hero-s { margin: 6px 0 0; font-size: .92rem; opacity: .92; }
.hero-kpi { position: relative; z-index: 1; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 12px; padding: 10px 14px; min-width: 170px; }
.hero-kpi span { display: block; font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; opacity: .85; }
.hero-kpi b { display: block; font-family: var(--f-head); font-size: 1.6rem; line-height: 1.15; color: #fff; }
.hero-kpi b.neg { color: #ffd0d3; }
.hero-kpi small { display: block; font-size: .78rem; opacity: .9; }
@media print { .hero { display: none; } }

/* the ledger */
.ledger { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: 0 0 6px; overflow: hidden; }
.ledger::before { content: ""; position: absolute; top: 0; bottom: 0; left: 22px; width: 0; border-left: 1.5px solid var(--margin); opacity: .85; }
.ledger::after { content: ""; position: absolute; top: 0; bottom: 0; left: 26px; width: 0; border-left: 1px solid var(--margin); opacity: .45; }
.lg-title { padding: 14px 14px 10px 40px; border-bottom: 1.5px solid var(--rule-2); }
.lg-title h2 { font-size: 1.15rem; }
.lg-title p { margin: 2px 0 0; font-size: .88rem; color: var(--ink-3); }
.lg-head, .lg-row, .lg-sec, .lg-tot { display: flex; justify-content: space-between; gap: 12px; padding: 7px 14px 7px 40px; border-bottom: 1px solid var(--rule); }
.lg-head { font-size: .8rem; color: var(--ink-3); font-weight: 600; padding-top: 6px; padding-bottom: 6px; }
.lg-sec { font-family: var(--f-head); font-weight: 600; color: var(--carbon); padding-top: 14px; font-size: 1rem; }
.lg-row span:first-child { padding-left: 12px; color: var(--ink-2); }
.lg-tot { font-weight: 700; }
.lg-tot.sub { font-weight: 600; }
.lg-tot .amt { border-top: 1px solid var(--ink-3); padding-top: 2px; margin-top: -3px; }
.lg-tot.gp { background: var(--carbon-soft); }
.lg-tot.np { font-family: var(--f-head); font-size: 1.2rem; font-weight: 700; padding-top: 12px; padding-bottom: 12px; border-bottom: 0; }
.lg-tot.np .amt { border-top: 1.5px solid var(--ink); border-bottom: 4px double var(--margin); padding-bottom: 1px; }
.amt { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.lg-foot { padding: 8px 14px 4px 40px; font-size: .85rem; color: var(--ink-3); }

/* tables */
.tw { overflow-x: auto; border: 1px solid var(--rule); border-radius: 3px; background: var(--sheet); }
table.t { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.t th, table.t td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
table.t th { font-weight: 600; color: var(--ink-2); background: var(--paper); white-space: nowrap; font-size: .82rem; }
table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
table.t tr.tot td { font-weight: 700; border-top: 1.5px solid var(--rule-2); }
table.t tr.np td { font-weight: 700; }
table.t input.inp { min-height: 36px; padding: 6px 8px; min-width: 88px; }
details.more > summary { cursor: pointer; font-weight: 600; font-family: var(--f-head); list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "+"; font-size: 1.3rem; line-height: 1; color: var(--ink-3); }
details.more[open] > summary::after { content: "\2212"; }
details.more[open] > summary { margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: .93rem; }
.kv > span:nth-child(2n) { text-align: right; }
.kv .b { font-weight: 700; border-top: 1px solid var(--rule-2); padding-top: 4px; }

/* reconcile */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: none; border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 999px; padding: 6px 12px; font-size: .88rem; font-weight: 600; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.chip span { color: var(--ink-3); font-weight: 600; margin-left: 4px; }
.chip[aria-pressed="true"] { background: var(--carbon); border-color: var(--carbon); color: var(--carbon-ink); }
.chip[aria-pressed="true"] span { color: inherit; opacity: .85; }
.chip.alert:not([aria-pressed="true"]) { border-color: var(--margin); color: var(--neg); }
.olist { background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; }
.ord { padding: 10px 12px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }
.ord:last-child { border-bottom: 0; }
.ord .id { font-weight: 700; word-break: break-all; }
.ord .pn { color: var(--ink-2); font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ord .meta { color: var(--ink-3); font-size: .85rem; }
.ord .right { text-align: right; grid-row: 1 / span 2; grid-column: 2; }
.ord .right b { display: block; }
.ord .full { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.tag { display: inline-block; font-size: .78rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--carbon-soft); color: var(--ink-2); }
.tag.bad { background: transparent; border: 1px solid var(--margin); color: var(--neg); }
.tag.good { background: transparent; border: 1px solid var(--pos); color: var(--pos); }
.cond { min-height: 34px; padding: 4px 8px; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--sheet); font-size: .88rem; }
.cond.def { border-style: dashed; }

/* costs */
.clist .crow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 8px; align-items: end; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.clist .crow:last-child { border-bottom: 0; }
.clist .crow.miss { box-shadow: inset 3px 0 0 var(--margin); padding-left: 10px; }
.clist .crow .info { grid-column: 1 / -1; min-width: 0; }
.clist .crow .ccat { grid-column: 1 / -1; }
.fill-seg { flex-wrap: wrap; }
.clist .crow .sku { font-weight: 700; word-break: break-all; }
.clist .crow .sub { font-size: .84rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clist .crow label { display: flex; flex-direction: column; gap: 3px; font-size: .76rem; font-weight: 600; color: var(--ink-3); min-width: 0; }
.clist .crow .inp { min-height: 38px; padding: 6px 8px; min-width: 0; width: 100%; }
@media (min-width: 620px) {
  .clist .crow { grid-template-columns: minmax(0, 1fr) 120px 70px 100px 170px; }
  .clist .crow .info { grid-column: auto; align-self: center; }
  .clist .crow .ccat { grid-column: auto; }
}

/* expenses */
.exp { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.exp:last-child { border-bottom: 0; }

.toast { position: fixed; left: 16px; right: 16px; margin: 0 auto; width: fit-content; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: .92rem; max-width: calc(100% - 32px); box-shadow: 0 4px 18px rgba(20, 22, 60, .25); z-index: 20; }
.toast[hidden] { display: none; }
.busy { position: fixed; inset: 0; background: rgba(15, 17, 34, .35); display: flex; align-items: center; justify-content: center; z-index: 30; }
.busy[hidden] { display: none; }
.busy div { background: var(--sheet); color: var(--ink); padding: 16px 20px; border-radius: 8px; font-weight: 600; }
.empty { text-align: center; padding: 28px 12px; }
.empty h2 { margin-bottom: 6px; }
@media (prefers-reduced-motion: no-preference) {
  .ledger .lg-tot.np .amt { transition: color .2s; }
}
@media print {
  .band, .tabs, .no-print, .toast { display: none !important; }
  body { background: #fff; }
}

  var E = window.HE, A = window.HA, S = A.S, esc = A.esc;
  var V = A.V = {};

  function mny(p) { return E.money(p, { paren: true }); }
  function amt(p) { return '<span class="amt' + (p < 0 ? ' neg' : '') + '">' + mny(p) + '</span>'; }
  function rs(p, np) { return E.money(p, { sym: '\u20b9', noPaise: !!np }); }
  function pct(x) { return (x * 100).toFixed(1) + '%'; }
  function pct0(x) { var v = x * 100; return (v >= 10 || v === 0 ? Math.round(v) : v.toFixed(1)) + '%'; }
  function fd(d) { return d ? E.fmtDate(d) : ''; }
  function pl(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function condWord(c) { return c === 'ok' ? 'back in stock' : 'not resellable'; }
  function packMode(st) { var v = st.packFromSku; return v === true || v === 'sku' ? 'sku' : v === false || v === 'name' ? 'name' : 'auto'; }
  function packSel(st) {
    var cur = packMode(st);
    return '<select class="inp" data-ch="set" data-k="packFromSku">' + [['auto', 'Automatic'], ['name', 'From the product name'], ['sku', 'From the SKU letters (BPYG05 = 4)']].map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === cur ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>';
  }
  function packNote(st) {
    var M = S.M, pk = M && M.pk, rule = E.packRule(st, M), mode = packMode(st);
    var sku = 'When the product name says the size ("Pack of 5"), that is used. Otherwise each letter before the number in the SKU is a piece and a colour in brackets is one more (BPYG05 = 4, PGWM(GREY)05 = 5, G21 = 1); the number is ignored.';
    var name = 'Read from the product name, like "Combo of 2" or "Pack of 5"; anything else counts as 1 piece.';
    if (mode !== 'auto') return rule === 'sku' ? sku : name;
    if (rule === 'sku') return 'Automatic: your SKUs follow the letters rule (' + pk.agree + ' of ' + pk.stated + ' combo names agree). ' + sku;
    return 'Automatic: ' + name;
  }
  A.packNote = packNote; // the Excel export (HX) prints it too

  function demoBar() {
    if (!S.demo) return '';
    return '<div class="note info demo-bar no-print"><p class="grow" style="margin:0">You are looking at sample data for a blouse and track pant store. Nothing here is saved.</p>' +
      '<button class="btn sm" data-act="endDemo">Close sample</button></div>';
  }
  function empty() {
    return hero(true) + '<section class="sheet empty"><h2>See your real profit in 2 minutes</h2><p class="muted">Upload the payment report from the Meesho Supplier Panel. PakkaBill takes out every fee, return, RTO, GST and product cost, and shows what you really earned. Or look around with sample data first.</p>' +
      '<div class="row" style="justify-content:center"><button class="btn pri" data-act="tab" data-tab="data">Upload files</button><button class="btn" data-act="demo">Try with sample data</button></div></section>';
  }
  /* PakkaBill's promise, at the top of the P&L */
  function hero(big) {
    var R = A.hasData() ? S.R : null, line = '';
    if (R && !big) {
      line = '<div class="hero-kpi"><span>Real profit</span><b class="' + (R.NP < 0 ? 'neg' : '') + '">' + rs(R.NP, true) + '</b><small>' + (R.NR ? pct(R.margin) + ' of what you sold' : '') + ' \u00b7 ' + esc(S.per.label) + '</small></div>';
    }
    return '<section class="hero' + (big ? ' big' : '') + '"><div class="hero-t"><p class="hero-k">PakkaBill Profit &amp; Loss</p><h1>Know your real profit</h1>' +
      '<p class="hero-s">Not just sales. Every Meesho fee, return, RTO, GST and product cost taken out, reconciled to the paisa.</p></div>' + line + '</section>';
  }

  function kv(pairs) {
    return '<div class="kv">' + pairs.map(function (p) {
      var b = p[2] ? ' class="b"' : '';
      return '<span' + b + '>' + esc(p[0]) + '</span><span' + (p[2] ? ' class="b' + (typeof p[1] === 'number' && p[1] < 0 ? ' neg' : '') + '"' : (typeof p[1] === 'number' && p[1] < 0 ? ' class="neg"' : '')) + '>' + (typeof p[1] === 'number' ? mny(p[1]) : esc(p[1])) + '</span>';
    }).join('') + '</div>';
  }

  /* ---------------- Returns, RTO and exchanges ---------------- */
  function returnsHtml() {
    var RV = S.RV, per = S.per;
    if (!RV || !RV.done) return '';
    var G = RV.G, ks = ['rto', 'ret', 'exch'], hasLost = G.lost.n > 0;
    if (hasLost) ks.push('lost');
    var HEAD = { rto: 'RTO', ret: 'Returns', exch: 'Exchanges', lost: 'Lost' };
    var SUB = { rto: 'Came back undelivered', ret: 'Customer sent it back', exch: 'Swapped for size or colour', lost: 'Lost by the courier' };
    var OF = { rto: [RV.rtoRate, RV.done, 'shipped'], ret: [RV.retRate, RV.delivered, 'delivered'], exch: [RV.exchRate, RV.delivered, 'delivered'], lost: [RV.lostRate, RV.done, 'shipped'] };
    function rupee(v) { return rs(Math.round(v), true); }
    function card(k) {
      var g = G[k], o = OF[k], lines = [
        ['Return shipping fee', g.retFee], ['Forward shipping', g.fwdShip], ['Meesho fees kept', g.fees],
        ['Packing', g.pack], ['Stock not resellable', g.stock], ['Paid back by Meesho', -g.back]
      ].filter(function (l) { return Math.round(l[1]); });
      return '<div class="rv-card rv-' + k + '"><div class="rv-top"><div><b>' + HEAD[k] + '</b><small>' + SUB[k] + '</small></div><strong>' + pct(o[0]) + '</strong></div>' +
        '<div class="rv-bar"><i style="width:' + Math.min(100, o[0] * 100).toFixed(1) + '%"></i></div>' +
        '<p class="rv-of">' + g.n + ' of ' + o[1] + ' orders ' + o[2] + '</p>' +
        '<div class="rv-money"><span>Money lost</span><b class="' + (g.loss > 0 ? 'neg' : '') + '">' + rupee(g.loss) + '</b></div>' +
        (g.n && g.loss ? '<p class="rv-per">' + rupee(g.loss / g.n) + ' per order</p>' : '') +
        (lines.length ? '<ul class="rv-lines">' + lines.map(function (l) { return '<li><span>' + l[0] + '</span><span class="' + (l[1] < 0 ? 'pos' : '') + '">' + (l[1] < 0 ? '+ ' : '') + rupee(Math.abs(l[1])) + '</span></li>'; }).join('') + '</ul>'
          : '<p class="rv-per">' + (k === 'exch' ? 'Still a sale, no extra fee' : 'No fees charged') + '</p>') +
        '</div>';
    }
    var h = '<div class="rv-total"><span>Total money lost</span><b class="' + (RV.loss > 0 ? 'neg' : '') + '">' + rupee(RV.loss) + '</b></div>' +
      '<div class="rv-cards">' + ks.map(card).join('') + '</div>';
    var notes = ['RTO' + (hasLost ? ' and lost' : '') + ' rates are of parcels shipped; return and exchange rates are of orders delivered.', 'Money lost is what Meesho cut from your payout for these orders (including GST), plus packing and stock you could not resell, less what Meesho paid back.'];
    if (G.exch.n) notes.push('Exchanges are still sales, so only extra return or exchange fees count as lost.');
    if (G.ret.pending || G.rto.pending) notes.push(pl(G.ret.pending + G.rto.pending, 'order') + ' are marked returned or RTO but Meesho has not taken the sale back yet, so some fees may still come.');
    var np = G.rto.noPay + G.ret.noPay + G.exch.noPay;
    if (np) notes.push(pl(np, 'order') + ' have no payment row yet, so their fees are not counted.');
    if (RV.transit) notes.push(pl(RV.transit, 'order') + ' still in transit are left out.');
    notes.push('RTO parcels and returns count as back in stock unless marked Not resellable in Reconcile or Settings. Counted by ' + (per.basis === 'order' ? 'order date' : 'payment date') + '.');
    h += '<details class="rv-sub"><summary>How this is counted</summary><ul class="rv-notes">' + notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></details>';
    var cols = RV.cols.filter(function (c) { return c.rto || c.ret || c.exch || c.lost; });
    if (cols.length) {
      h += '<details class="rv-sub"><summary>Each Meesho fee on returns and RTO</summary><div class="tw"><table class="t"><thead><tr><th>Column in Meesho file</th>' + ks.map(function (k) { return '<th class="n">' + HEAD[k] + '</th>'; }).join('') + '</tr></thead><tbody>' +
        cols.map(function (c) { return '<tr><td>' + esc(c.label) + '</td>' + ks.map(function (k) { return '<td class="n">' + (c[k] ? amt(c[k]) : '–') + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table></div><p class="small muted" style="margin:6px 0 0">Minus is money Meesho took; plus is money it gave back on these orders.</p></details>';
    }
    if (RV.skus.length) {
      var more = RV.skus.length > 25;
      h += '<details class="rv-sub"><summary>RTO, returns and exchanges by SKU</summary><div class="tw"><table class="t"><thead><tr><th>SKU</th><th class="n">Shipped</th><th class="n">RTO</th><th class="n">Returns</th><th class="n">Exchanges</th><th class="n">Money lost</th></tr></thead><tbody>' +
        RV.skus.slice(0, 25).map(function (x) {
          function c(n, r) { return n ? n + ' <span class="small muted">(' + pct0(r) + ')</span>' : '–'; }
          return '<tr><td><b>' + esc(x.sku) + '</b>' + (x.pn ? '<div class="small muted">' + esc(x.pn) + '</div>' : '') + '</td><td class="n">' + x.done + '</td><td class="n' + (x.rtoRate >= 0.25 ? ' neg' : '') + '">' + c(x.rto + x.lost, x.rtoRate) + '</td><td class="n' + (x.retRate >= 0.25 ? ' neg' : '') + '">' + c(x.ret, x.retRate) + '</td><td class="n">' + c(x.exch, x.exchRate) + '</td><td class="n">' + (x.loss ? '<span class="neg">' + mny(-x.loss) + '</span>' : '–') + '</td></tr>';
        }).join('') + '</tbody></table></div><p class="small muted" style="margin:6px 0 0">Red is 25% or more. ' + (more ? 'Showing the 25 SKUs that lose the most; the Excel download has all of them. ' : '') + 'A high RTO rate often means buyers change their mind before delivery (try fewer COD orders to far pincodes); a high return rate usually points to size, colour or quality not matching the photos.</p></details>';
    }
    return '<details class="sheet more" open><summary>Returns, RTO and exchanges</summary>' + h + '</details>';
  }
  A.returnsHtml = returnsHtml;

  /* ---------------- Profit by category ---------------- */
  function categoryRows() {
    var R = S.R, RV = S.RV, m = {};
    function row(k) { return m[k] || (m[k] = { cat: k, skus: 0, sold: 0, NS: 0, profit: 0, done: 0, delivered: 0, rto: 0, ret: 0, loss: 0 }); }
    R.skus.forEach(function (x) { var r = row(A.catOf(x.sku, x.pn)); r.skus++; r.sold += x.sold; r.NS += x.NS; r.profit += x.contrib; });
    (RV ? RV.skus : []).forEach(function (x) { var r = row(A.catOf(x.sku, x.pn)); r.rto += x.rto + x.lost; r.ret += x.ret; r.loss += x.loss; });
    return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return b.NS - a.NS; });
  }
  A.categoryRows = categoryRows;
  function categoryHtml() {
    var rows = categoryRows();
    if (!rows.length) return '';
    var tot = { NS: 0, profit: 0 }; rows.forEach(function (r) { tot.NS += r.NS; tot.profit += r.profit; });
    var body = rows.map(function (r) {
      var margin = r.NS > 0 ? r.profit / r.NS : 0;
      return '<tr><td><b>' + esc(r.cat) + '</b><div class="small muted">' + pl(r.skus, 'SKU') + '</div></td>' +
        '<td class="n' + (r.profit < 0 ? ' neg' : '') + '"><b>' + mny(r.profit) + '</b></td><td class="n' + (margin < 0 ? ' neg' : '') + '">' + (r.NS > 0 ? pct(margin) : '\u2013') + '</td>' +
        '<td class="n">' + mny(r.NS) + '</td><td class="n">' + r.sold + '</td>' +
        '<td class="n">' + (r.rto + r.ret) + '</td><td class="n">' + (r.loss ? '<span class="neg">' + mny(-r.loss) + '</span>' : '\u2013') + '</td></tr>';
    }).join('');
    return '<details class="sheet more"' + (rows.length > 1 ? ' open' : '') + '><summary>Profit by category</summary><div class="tw"><table class="t"><thead><tr><th>Category</th><th class="n">Profit</th><th class="n">Margin</th><th class="n">Net sales</th><th class="n">Orders</th><th class="n">RTO + returns</th><th class="n">Lost on them</th></tr></thead><tbody>' + body +
      '<tr class="tot"><td>All categories</td><td class="n"><b>' + mny(tot.profit) + '</b></td><td class="n">' + (tot.NS > 0 ? pct(tot.profit / tot.NS) : '') + '</td><td class="n">' + mny(tot.NS) + '</td><td></td><td></td><td></td></tr></tbody></table></div>' +
      '<p class="small muted" style="margin:8px 0 0">Categories are read from Meesho\u2019s product names. Change any SKU\u2019s category in the Costs tab. Profit is before ads and other expenses, like Profit by SKU.</p></details>';
  }

  /* ---------------- P&L ---------------- */
  V.pl = function () {
    if (!A.hasData()) return empty();
    var R = S.R, K = R.K, st = A.cfg(), per = S.per, h = hero(false) + demoBar();
    var opts = '<option value="all"' + (S.sel.mode === 'all' ? ' selected' : '') + '>All data</option>';
    S.months.forEach(function (m) { opts += '<option value="m:' + m + '"' + (S.sel.mode === 'month' && S.sel.m === m ? ' selected' : '') + '>' + E.fmtMonth(m) + '</option>'; });
    opts += '<option value="custom"' + (S.sel.mode === 'custom' ? ' selected' : '') + '>Custom dates</option>';
    h += '<section class="sheet no-print"><div class="period"><div class="stack">' +
      '<label class="f">Period<select class="inp" data-ch="per">' + opts + '</select></label>' +
      (S.sel.mode === 'custom' ? '<div class="row"><label class="f grow">From<input type="date" class="inp" data-ch="from" value="' + esc(S.sel.from) + '"></label><label class="f grow">To<input type="date" class="inp" data-ch="to" value="' + esc(S.sel.to) + '"></label></div>' : '') +
      '<div class="row"><span class="small muted">Count sales by</span><div class="seg" role="group" aria-label="Count sales by">' +
      '<button data-act="basis" data-v="pay" aria-pressed="' + (S.sel.basis === 'pay') + '">Payment date</button>' +
      '<button data-act="basis" data-v="order" aria-pressed="' + (S.sel.basis === 'order') + '">Order date</button></div></div></div>' +
      '<div class="dl"><button class="btn pri" data-act="xlsx">Download Excel</button><button class="btn" data-act="pdf">Download PDF</button></div></div></section>';

    if (!S.H.legs) {
      h += '<div class="note bad"><p>Add the payment report to see profit. The orders report alone has no settlement amounts.</p></div>';
    }
    h += '<div class="slip" role="group" aria-label="Summary">' +
      '<div class="np"><div><small>Net profit</small><strong class="' + (R.NP < 0 ? 'neg' : '') + '">' + rs(R.NP, true) + '</strong></div>' +
      '<span class="small muted">' + (R.NR ? pct(R.margin) + ' of net revenue' : '') + '</span></div>' +
      '<div><small>Net sales</small><strong>' + rs(R.NS, true) + '</strong></div>' +
      '<div><small>Received from Meesho</small><strong>' + rs(R.payout, true) + '</strong></div>' +
      '<div><small>Orders sold</small><strong>' + K.sales + '</strong></div>' +
      '<div><small>RTO \u00b7 Return \u00b7 Exchange</small><strong>' + (S.RV ? pct(S.RV.rtoRate) + ' \u00b7 ' + pct(S.RV.retRate) + ' \u00b7 ' + pct(S.RV.exchRate) : (K.parcels ? pct(R.returnRate) : '0%')) + '</strong></div></div>';

    var notes = '';
    if (R.missing.length) {
      var u = 0; R.missing.forEach(function (x) { u += x.units; });
      notes += '<div class="note bad"><p>Cost is missing for ' + pl(R.missing.length, 'SKU') + ' (' + pl(u, 'piece') + '). Profit is overstated until you add them.</p><button class="btn sm" data-act="tab" data-tab="costs">Add costs</button></div>';
    }
    if (K.rdef) {
      if (st.returnDefault === 'ok' && st.rtoDefault === 'ok') {
        notes += '<div class="note info"><p>' + K.rdef + ' returns and RTO parcels are counted as back in stock, so their cost goes back to your stock. If any came back damaged, used or wrong, mark it Not resellable in Reconcile.</p><button class="btn sm" data-act="rcgo" data-b="returned">Review returns</button></div>';
      } else {
        notes += '<div class="note"><p>' + K.rdef + ' returns and RTO parcels use the default condition: customer returns ' + condWord(st.returnDefault) + ', RTO parcels ' + condWord(st.rtoDefault) + '. Mark each one in Reconcile for exact stock cost.</p><button class="btn sm" data-act="rcgo" data-b="returned">Review returns</button></div>';
      }
    }
    if (K.revPend) {
      notes += '<div class="note info"><p>' + pl(K.revPend, 'order') + ' show as returned or RTO, but Meesho has not reversed the sale in these files yet (' + rs(K.revPendV) + ' of sales). Profit will drop when that reversal is paid out.</p></div>';
    }
    if (K.unexpl) {
      notes += '<div class="note info"><p>' + (K.unexpl === 1 ? '1 settlement row does' : K.unexpl + ' settlement rows do') + ' not fully add up from Meesho\u2019s own columns: Meesho paid ' + rs(Math.abs(K.O)) + (K.O < 0 ? ' less' : ' more') + ' than they add up to. The difference is shown as its own line, so the total still matches Meesho.</p></div>';
    }
    if (notes) h += '<div class="stack no-print">' + notes + '</div>';

    var lines = '';
    R.lines.forEach(function (l) {
      if (l.k === 'sec') lines += '<div class="lg-sec">' + esc(l.l) + '</div>';
      else if (l.k === 'row') lines += '<div class="lg-row"><span>' + esc(l.l) + '</span>' + amt(l.v) + '</div>';
      else lines += '<div class="lg-tot' + (l.k === 'tot' ? '' : ' ' + l.k) + '"><span>' + esc(l.l) + '</span>' + amt(l.v) + '</div>';
    });
    var foot = ['Brackets mean a cost or a deduction.'];
    if (R.REGD) foot.push('Sales and charges are shown without GST; the GST section below has the tax.');
    if (K.rlu) foot.push(pl(K.rlu, 'returned piece') + ' counted as not resellable, so their cost (' + rs(K.rlv) + ') stays in cost of goods.');
    h += '<section class="ledger" aria-label="Profit and loss statement"><div class="lg-title"><h2>Profit and loss statement</h2>' +
      '<p>' + esc((st.biz ? st.biz + ', ' : '') + per.label) + ', counted by ' + (per.basis === 'order' ? 'order date' : 'payment date') + '</p></div>' +
      '<div class="lg-head"><span>Particulars</span><span>Amount (\u20b9)</span></div>' + lines +
      '<div class="lg-foot">' + esc(foot.join(' ')) + '</div></section>';

    h += returnsHtml();
    h += categoryHtml();
    h += '<details class="sheet more" open><summary>How profit ties to money received</summary>' +
      kv(R.bridge.map(function (b) { return [b.l, b.v, !!b.k]; })) +
      '<p class="small muted" style="margin:10px 0 0">Money received is the sum of Final Settlement Amount plus ads, referral and compensation entries. It should match the Meesho credits in your bank for the same payment dates.</p></details>';

    var g = R.gst, tx = '';
    if (g) {
      tx += kv([['Output GST on net sales', g.out], ['Less: input credit on Meesho charges', -g.itcCh], ['Less: input credit on ads', -g.itcAds],
        ['Net GST payable', g.net, true], ['Less: TCS already collected by Meesho', -g.tcs], ['GST left to pay in cash', g.cash, true]]);
    } else {
      tx += '<p>GST is not split out because GST registration is off in Settings. Meesho charges and ads are counted including GST.</p>';
    }
    tx += '<p class="small" style="margin:10px 0 0">Meesho deducted ' + rs(-K.T) + ' TCS (under GST) and ' + rs(-K.D) + ' TDS (income tax, section 194-O) from these payouts. ' +
      (R.claim ? 'Both are added back to profit because you can claim them: TCS in your GST return and TDS in your income tax return, where it shows in Form 26AS.' : 'They are counted as an expense, as chosen in Settings.') + '</p>';
    if (g) tx += '<p class="small muted" style="margin:6px 0 0">Input credit is worked out at 18% on the columns Meesho marks as including GST. Check it against Meesho\u2019s monthly tax invoice before you file.</p>';
    h += '<details class="sheet more"><summary>GST, TCS and TDS</summary>' + tx + '</details>';

    var sk = R.skus.map(function (x) {
      return '<tr><td><b>' + esc(x.sku) + '</b>' + (x.pcs > 1 ? ' <span class="tag">pack of ' + x.pcs + '</span>' : '') + (x.pn ? '<div class="small muted">' + esc(x.pn) + '</div>' : '') + '</td><td class="n">' + x.sold + '</td><td class="n">' + x.units + '</td><td class="n">' + (x.retU + x.rto) + '</td>' +
        '<td class="n">' + mny(x.NS) + '</td><td class="n' + (x.contrib < 0 ? ' neg' : '') + '">' + mny(x.contrib) + '</td><td class="n' + (x.perOrder < 0 ? ' neg' : '') + '">' + (x.sold ? mny(x.perOrder) : '') + '</td>' +
        '<td class="n">' + (x.sold ? rs(x.avgPrice, true) : '') + '</td><td class="n' + (x.sold && x.breakEven > x.avgPrice ? ' neg' : '') + '">' + (x.sold ? rs(x.breakEven, true) : '') + '</td></tr>';
    }).join('');
    h += '<details class="sheet more"><summary>Profit by SKU</summary><div class="tw"><table class="t"><thead><tr><th>SKU</th><th class="n">Orders</th><th class="n">Pieces</th><th class="n">Returns and RTO</th><th class="n">Net sales</th><th class="n">Profit</th><th class="n">Per order</th><th class="n">Price now</th><th class="n">Break-even price</th></tr></thead><tbody>' + sk +
      '<tr class="tot"><td>Not tied to a SKU (ads, referral, account credits, expenses)</td><td></td><td></td><td></td><td></td><td class="n' + (R.unalloc < 0 ? ' neg' : '') + '">' + mny(R.unalloc) + '</td><td></td><td></td><td></td></tr>' +
      '<tr class="np"><td>Net profit</td><td class="n">' + K.sales + '</td><td class="n">' + K.fu + '</td><td></td><td class="n">' + mny(R.NS) + '</td><td class="n' + (R.NP < 0 ? ' neg' : '') + '">' + mny(R.NP) + '</td><td></td><td></td><td></td></tr></tbody></table></div>' +
      '<p class="small muted" style="margin:8px 0 0">SKU profit is after cost of goods, Meesho charges and packaging, before ads and other expenses. Price now is what buyers paid per order on average. Break-even price is the customer price where the SKU\u2019s profit per order would be zero, with the same returns, GST and charges; red means it is above today\u2019s price, so the SKU loses money.</p></details>';

    if (S.MO.length > 1) {
      var mo = S.MO.map(function (m) {

      '<div class="row"><button class="btn" data-act="backup">Download backup</button><label class="btn">Restore backup<input type="file" class="sr" data-file="restore" accept=".json,application/json"></label></div></section>' +
      '<section class="sheet stack only-own"><h2>Appearance</h2><div class="seg" role="group" aria-label="Theme">' +
      [['auto', 'Match device'], ['light', 'Light'], ['dark', 'Dark']].map(function (t) { return '<button data-act="theme" data-v="' + t[0] + '" aria-pressed="' + (th === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div></section>' +
      '<section class="sheet stack"><h2>Remove data</h2><div class="row"><button class="btn danger" data-act="clearFiles">Remove uploaded files</button><button class="btn danger" data-act="resetAll">Erase everything</button></div></section>';
    return '<div class="stack">' + h + '</div>';
  };
})();

<script>
/* Hisaab exports: styled Excel workbook (xlsx-js-style) and PDF statement (jsPDF + autotable). */
(function () {
  'use strict';
  var HX = window.HX = {};
  var BL = { settled: 'Paid', awaiting: 'Awaiting payment', overdue: 'Payment overdue', transit: 'In transit', returned: 'Customer return', rto: 'RTO or lost', cancelled: 'Cancelled', adjust: 'Adjustment only', older: 'Before these files', other: 'Other' };
  var FL = { recovery: 'Recovery charged', unexplained: 'Does not add up', paidCancelled: 'Paid but cancelled', negative: 'Negative payout', claim: 'Claim received', revPending: 'Sale not reversed yet', overdue: 'Payment overdue' };
  function r(p) { return Math.round(p) / 100; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function inPer(S, p) { var d = S.per.basis === 'order' ? (p.od || p.pd) : p.pd; return !!d && d >= S.per.from && d <= S.per.to; }

  /* ================= Excel ================= */
  HX.xlsx = function (ctx) {
    var S = ctx.S, E = ctx.E, R = S.R, K = R.K, st = ctx.cfg, X = window.XLSX, per = S.per;
    var NUM = '#,##0.00;[Red](#,##0.00);"-"', INT = '0';
    var INK = '1B1F3B', CARBON = '2F3490', SOFT = 'E8E9F8', RULE = 'B9C1DD', RED = 'C8323A', GREY = '6F7599';
    var ST = {
      title: { font: { bold: true, sz: 15, color: { rgb: INK } } },
      sub: { font: { sz: 11, color: { rgb: GREY } } },
      head: { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { patternType: 'solid', fgColor: { rgb: CARBON } }, alignment: { vertical: 'center', wrapText: true } },
      sec: { font: { bold: true, color: { rgb: CARBON } }, fill: { patternType: 'solid', fgColor: { rgb: SOFT } } },
      row: { alignment: { indent: 1 } },
      tot: { font: { bold: true }, border: { top: { style: 'thin', color: { rgb: RULE } } } },
      gp: { font: { bold: true }, fill: { patternType: 'solid', fgColor: { rgb: SOFT } }, border: { top: { style: 'thin', color: { rgb: RULE } } } },
      np: { font: { bold: true, sz: 12 }, border: { top: { style: 'thin', color: { rgb: INK } }, bottom: { style: 'double', color: { rgb: RED } } } },
      bold: { font: { bold: true } },
      note: { font: { color: { rgb: GREY } }, alignment: { wrapText: true, vertical: 'top' } }
    };
    function merge(a, b) {
      var o = {}; [a, b].forEach(function (s) { if (!s) return; for (var k in s) o[k] = (typeof s[k] === 'object' && !Array.isArray(s[k])) ? Object.assign({}, o[k] || {}, s[k]) : s[k]; });
      return o;
    }
    function m(p, s) { return { v: r(p), t: 'n', z: NUM, s: merge({ numFmt: NUM, alignment: { horizontal: 'right' } }, s) }; }
    function n(v, s) { return { v: +v || 0, t: 'n', z: INT, s: merge({ numFmt: INT, alignment: { horizontal: 'right' } }, s) }; }
    function t(v, s) { return { v: String(v == null ? '' : v), t: 's', s: s || undefined }; }
    function sheet(rows, widths, freeze) {
      var ws = {}, maxC = 0;
      rows.forEach(function (row, i) {
        (row || []).forEach(function (c, j) {
          if (c === null || c === undefined) return;
          var cell = (typeof c === 'object') ? c : (typeof c === 'number' ? { v: c, t: 'n' } : { v: String(c), t: 's' });
          if (cell.t === 's' && cell.v === '' && !cell.s) return;
          if (!cell.s) delete cell.s;
          ws[X.utils.encode_cell({ r: i, c: j })] = cell;
          if (j + 1 > maxC) maxC = j + 1;
        });
      });
      ws['!ref'] = X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(rows.length - 1, 0), c: Math.max(maxC - 1, 0) } });
      if (widths) ws['!cols'] = widths.map(function (w) { return { wch: w }; });
      if (freeze) ws['!freeze'] = freeze;
      return ws;
    }
    function heads(list) { return list.map(function (h) { return t(h, ST.head); }); }
    var wb = X.utils.book_new();
    var basis = per.basis === 'order' ? 'order date' : 'payment date';

    /* P&L */
    var P = [];

    if (st.gstin) P.push([t('GSTIN'), t(st.gstin)]);
    P.push([t('Generated'), t(today())]);

    P.push(heads(['Particulars', 'Amount (Rs)']));
    R.lines.forEach(function (l) {
      if (l.k === 'sec') P.push([t(l.l, ST.sec), t('', ST.sec)]);
      else if (l.k === 'row') P.push([t(l.l, ST.row), m(l.v)]);
      else { var s = ST[l.k === 'tot' || l.k === 'sub' ? 'tot' : l.k]; P.push([t(l.l, s), m(l.v, s)]); }
    });
    P.push([]);
    P.push([t('How profit ties to money received', ST.sec), t('', ST.sec)]);
    R.bridge.forEach(function (b) { var s = b.k === 'np' ? ST.np : b.k ? ST.tot : null; P.push([t(b.l, s || ST.row), m(b.v, s)]); });
    if (R.gst) {
      var g = R.gst;
      P.push([]);
      P.push([t('GST summary', ST.sec), t('', ST.sec)]);
      [['Output GST on net sales', g.out], ['Less: input credit on Meesho charges', -g.itcCh], ['Less: input credit on ads', -g.itcAds], ['Net GST payable', g.net, 1], ['Less: TCS already collected by Meesho', -g.tcs], ['GST left to pay in cash', g.cash, 1]]
        .forEach(function (x) { P.push([t(x[0], x[2] ? ST.tot : ST.row), m(x[1], x[2] ? ST.tot : null)]); });
    }

    P.push([t('TCS collected under GST', ST.row), m(-K.T)]);
    P.push([t('TDS under section 194-O', ST.row), m(-K.D)]);
    P.push([t(R.claim ? 'Both are claimable, so they are added back to profit.' : 'Both are counted as an expense (Settings).', ST.note)]);
    X.utils.book_append_sheet(wb, sheet(P, [58, 18], { xSplit: 0, ySplit: 8 }), 'P&L');

    /* SKU wise */
    var SK = [heads(['SKU', 'Product', 'Pieces per order', 'Orders sold', 'Pieces sold', 'Pieces returned', 'RTO parcels', 'Gross sales', 'Returns', 'Net sales', 'Output GST', 'Net revenue', 'Cost of goods', 'Meesho charges', 'Claims and recoveries', 'TCS/TDS as expense', 'Packaging', 'Profit', 'Profit per order', 'Profit per piece', 'Customer price per order', 'Break-even customer price'])];
    R.skus.forEach(function (x) {
      SK.push([t(x.sku), t(x.pn), n(x.pcs), n(x.sold), n(x.units), n(x.retU), n(x.rto), m(x.S), m(x.R), m(x.NS), m(-x.OUT), m(x.NR), m(-x.COGS), m(x.MC), m(x.OCR), m(R.claim ? 0 : x.TX), m(-x.pack), m(x.contrib, ST.bold), m(x.perOrder), m(x.perUnit), m(x.sold ? x.avgPrice : 0), m(x.sold ? x.breakEven : 0)]);
    });
    SK.push([t('Not tied to a SKU (ads, referral, account credits, expenses)', ST.tot)].concat(new Array(16).fill(t('', ST.tot))).concat([m(R.unalloc, ST.tot)]));
    SK.push([t('Net profit', ST.np), t('', ST.np), t('', ST.np), n(K.sales, ST.np), n(K.fu, ST.np)].concat(new Array(12).fill(t('', ST.np))).concat([m(R.NP, ST.np)]));
    X.utils.book_append_sheet(wb, sheet(SK, [16, 40, 9, 10, 10, 10, 10, 13, 13, 13, 12, 13, 13, 14, 13, 12, 11, 13, 12, 12, 14, 15], { xSplit: 1, ySplit: 1 }), 'SKU wise');

    /* Category wise */
    if (A.categoryRows) {
      var CR = [heads(['Category', 'SKUs', 'Orders sold', 'Net sales', 'Profit', 'Margin', 'RTO and returns', 'Lost on RTO and returns'])];
      A.categoryRows().forEach(function (r) {
        CR.push([t(r.cat), n(r.skus), n(r.sold), m(r.NS), m(r.profit, ST.bold), t(r.NS > 0 ? (r.profit * 100 / r.NS).toFixed(1) + '%' : ''), n(r.rto + r.ret), m(-r.loss)]);
      });
      var catOfSku = {};
      R.skus.forEach(function (x) { catOfSku[x.sku] = A.catOf(x.sku, x.pn); });
      CR.push([]);
      CR.push([t('SKU', ST.sec), t('Category', ST.sec), t('Product', ST.sec)]);
      R.skus.forEach(function (x) { CR.push([t(x.sku), t(catOfSku[x.sku]), t(x.pn)]); });
      X.utils.book_append_sheet(wb, sheet(CR, [28, 22, 40, 14, 14, 10, 14, 18], { xSplit: 1, ySplit: 1 }), 'Category wise');
    }

    /* Returns, RTO and exchanges */
    var RV = S.RV;
    if (RV && RV.done) {
      var G = RV.G, pc = function (x) { return t((x * 100).toFixed(1) + '%'); };
      var RT = [heads(['', 'RTO', 'Customer returns', 'Exchanges', 'Lost'])];
      var rrow = function (l, f, st) { RT.push([t(l, st || ST.row)].concat(['rto', 'ret', 'exch', 'lost'].map(function (k) { return f(G[k], k); }))); };
      rrow('Orders', function (g) { return n(g.n); });
      rrow('Rate', function (g, k) { return pc(k === 'rto' ? RV.rtoRate : k === 'lost' ? RV.lostRate : k === 'ret' ? RV.retRate : RV.exchRate); });
      rrow('Return shipping fee', function (g) { return m(-g.retFee); });
      rrow('Forward shipping', function (g) { return m(-g.fwdShip); });
      rrow('Commission and other fees kept', function (g) { return m(-g.fees); });
      rrow('Packing', function (g) { return m(-g.pack); });
      rrow('Stock not resellable', function (g) { return m(-g.stock); });
      rrow('Paid back by Meesho', function (g) { return m(g.back); });
      rrow('Total lost', function (g) { return m(-g.loss, ST.tot); }, ST.tot);
      rrow('Lost per order', function (g) { return m(g.n ? -Math.round(g.loss / g.n) : 0); });
      RT.push([]);
      RT.push([t('RTO and lost rates are of ' + RV.done + ' parcels shipped; return and exchange rates are of ' + RV.delivered + ' orders delivered. Amounts include GST, as in Meesho\u2019s file.', ST.note)]);
      RT.push([]);
      RT.push([t('Each Meesho fee', ST.sec), t('', ST.sec), t('', ST.sec), t('', ST.sec), t('', ST.sec)]);
      RV.cols.forEach(function (c) { if (c.rto || c.ret || c.exch || c.lost) RT.push([t(c.label), m(c.rto), m(c.ret), m(c.exch), m(c.lost)]); });
      RT.push([]);
      RT.push([t('SKU', ST.sec), t('Shipped', ST.sec), t('Delivered', ST.sec), t('RTO and lost', ST.sec), t('RTO %', ST.sec), t('Returns', ST.sec), t('Return %', ST.sec), t('Exchanges', ST.sec), t('Exchange %', ST.sec), t('Money lost', ST.sec)]);
      RV.skus.forEach(function (x) { RT.push([t(x.sku), n(x.done), n(x.delivered), n(x.rto + x.lost), pc(x.rtoRate), n(x.ret), pc(x.retRate), n(x.exch), pc(x.exchRate), m(-x.loss)]); });
      X.utils.book_append_sheet(wb, sheet(RT, [40, 14, 16, 14, 12, 11, 11, 11, 11, 13], { xSplit: 1, ySplit: 1 }), 'Returns & RTO');
    }

    /* Month wise */
    if (S.MO.length) {
      var MO = [heads(['Month', 'Net sales', 'Net revenue', 'Cost of goods', 'Gross profit', 'Meesho charges', 'Ads', 'Claims and credits', 'Operating expenses', 'Net profit', 'Received from Meesho', 'Orders sold', 'Parcels'])];
      S.MO.forEach(function (x) { MO.push([t(E.fmtMonth(x.m)), m(x.NS), m(x.NR), m(-x.COGS), m(x.GP), m(x.MCx), m(x.ads), m(x.credits), m(-x.OPEX), m(x.NP, ST.bold), m(x.payout), n(x.orders), n(x.parcels)]); });
      X.utils.book_append_sheet(wb, sheet(MO, [12, 13, 13, 13, 13, 14, 12, 13, 14, 13, 15, 10, 10], { xSplit: 1, ySplit: 1 }), 'Month wise');
    }

    /* Settlement rows in the period, every Meesho column that was used */
    var cols = R.cols.slice().sort(function (a, b) { var ks = Object.keys(S.M.reg); return ks.indexOf(a.key) - ks.indexOf(b.key); });
    var L = [heads(['Payment date', 'Sub order no', 'Order date', 'SKU', 'Product', 'Status', 'Qty', 'GST %', 'Transaction ID'].concat(cols.map(function (c) { return c.label; })).concat(['Final Settlement Amount', 'Unexplained difference']))];
    S.M.pay.forEach(function (p) {
      if (!inPer(S, p)) return;

      cols.forEach(function (c) { row.push(m(p.a[c.key] || 0)); });

    X.utils.book_append_sheet(wb, sheet(L, [12, 24, 12, 22, 30, 12, 6, 7, 22].concat(cols.map(function () { return 14; })).concat([16, 12]), { xSplit: 2, ySplit: 1 }), 'Settlement rows');

    /* Reconciliation, all orders */

    S.REC.rows.forEach(function (x) {

        t(x.cond ? (x.cond === 'ok' ? 'Back in stock' : 'Not resellable') + (x.condDef ? ' (default)' : '') : ''), t(x.flags.map(function (f) { return FL[f] || f; }).join(', '))]);

    X.utils.book_append_sheet(wb, sheet(RC, [24, 12, 22, 30, 14, 18, 8, 12, 13, 12, 12, 11, 12, 11, 13, 18, 30], { xSplit: 1, ySplit: 1 }), 'Reconciliation');

    /* Payouts */
    var PO = [heads(['Payment date', 'Orders', 'Settlements', 'Ads', 'Referral', 'Compensation and recovery', 'Net received', 'Transaction IDs'])];
    S.PO.forEach(function (p) { PO.push([t(p.d), n(p.n), m(p.f), m(p.ads), m(p.ref), m(p.adj), m(p.net, ST.bold), t(p.tx.join(', '))]); });
    X.utils.book_append_sheet(wb, sheet(PO, [13, 8, 13, 12, 11, 14, 14, 40], { xSplit: 1, ySplit: 1 }), 'Payouts');

    /* Meesho charges by column */
    var CH = [heads(['Column in Meesho file', 'Counted as', 'Amount in file', 'GST part (input credit)', 'Amount excl. GST'])];
    R.cols.forEach(function (c) { CH.push([t(c.label), t(E.CATL[c.cat] || c.cat), m(c.v), m(-c.g), m(c.v - c.g)]); });
    X.utils.book_append_sheet(wb, sheet(CH, [46, 28, 15, 18, 16], { xSplit: 0, ySplit: 1 }), 'Meesho columns');

    /* Expenses */
    var EX = [heads(['Expense', 'How often', 'Amount entered', 'Counted in this period'])];
    var inP = {}; R.EXL.forEach(function (e) { inP[e.id] = e.amt; });

    EX.push([t('Packaging (' + K.parcels + ' parcels)'), t('Per parcel'), m(ctx.cfg.pack || 0), m(K.pack)]);
    X.utils.book_append_sheet(wb, sheet(EX, [30, 22, 15, 20]), 'Expenses');

    /* Notes */
    var H = S.H, mt = 0, nt = 0;
    ctx.w.files.forEach(function (f) { f.sheets.forEach(function (s) { if (s.type === 'pay') { mt += s.matched || 0; nt += s.n || 0; } }); });
    var NO = [[t('How this report is built', ST.title)], []];
    [
      ['Money received', 'Sum of Final Settlement Amount from Order Payments, plus Ads Cost, Referral Payments and Compensation and Recovery entries, for the payment dates in the period.'],
      ['Sales', 'Total Sale Amount and Total Sale Return Amount columns. With GST registration on, output GST is taken out at each row\u2019s Product GST %.'],
      ['Meesho charges', 'Every fee column that makes up Final Settlement. Columns marked "incl. GST" have 18% GST taken out as input credit.'],
      ['Cost of goods', 'Your cost per piece times the pieces shipped. Returns marked back in stock are added back; RTO or lost parcels marked not resellable are written off.'],
      ['Combo size', window.HA.packNote(st) + ' Typed counts on the Costs tab take priority.'],
      ['TCS and TDS', R.claim ? 'Deducted by Meesho and claimable, so added back to profit.' : 'Counted as an expense, as chosen in Settings.'],
      ['Check', 'Settlement rows that add up exactly to Final Settlement: ' + mt + ' of ' + nt + '. Any difference is shown as "Unexplained difference" so totals still match Meesho.'],
      ['Payment dates covered', H.pd0 ? H.pd0 + ' to ' + H.pd1 : 'none'],
      ['Orders report covered', H.od0 ? H.od0 + ' to ' + H.od1 + ' (' + H.ordRows + ' orders)' : 'not uploaded'],

      ['Customer returns default', st.returnDefault === 'ok' ? 'Back in stock' : 'Not resellable'],
      ['RTO parcels default', st.rtoDefault === 'ok' ? 'Back in stock' : 'Not resellable'],
      ['Returns using the default', String(K.rdef)],

    ].forEach(function (x) { NO.push([t(x[0], ST.bold), t(x[1], ST.note)]); });

  /* ================= PDF: PakkaBill branded P&L report ================= */
  HX.pdf = function (ctx) {
    var S = ctx.S, E = ctx.E, R = S.R, K = R.K, st = ctx.cfg, per = S.per, RV = S.RV, HA = window.HA || {};

    function mn(p) { return E.money(p, { paren: true }); }

    var biz = st.biz || 'Meesho seller';
    var reportId = 'PB-PL-' + String(per.from || '').replace(/-/g, '') + '-' + String(per.to || '').replace(/-/g, '');

    // the PakkaBill mark, drawn as shapes (sharp at any size)
    function logo(x, y, s) {

      doc.setFillColor(253, 230, 150); doc.roundedRect(x + s * 0.34, y + s * 0.2, s * 0.4, s * 0.52, s * 0.04, s * 0.04, 'F');
      doc.setFillColor(248, 212, 222); doc.roundedRect(x + s * 0.3, y + s * 0.23, s * 0.4, s * 0.52, s * 0.04, s * 0.04, 'F');
      doc.setFillColor(255, 255, 255); doc.roundedRect(x + s * 0.24, y + s * 0.26, s * 0.4, s * 0.52, s * 0.04, s * 0.04, 'F');
      doc.setFillColor(214, 36, 48); doc.roundedRect(x + s * 0.47, y + s * 0.32, s * 0.12, s * 0.06, s * 0.02, s * 0.02, 'F');
      doc.setFillColor(88, 96, 170); doc.roundedRect(x + s * 0.3, y + s * 0.46, s * 0.26, s * 0.035, s * 0.017, s * 0.017, 'F');
      doc.setFillColor(160, 166, 212); doc.roundedRect(x + s * 0.3, y + s * 0.54, s * 0.18, s * 0.035, s * 0.017, s * 0.017, 'F');

    fill(CORAL); doc.rect(0, 118, PW, 3, 'F');
    logo(M, 26, 44);
    ink([255, 255, 255]); font('bold', 20); doc.text('PakkaBill', M + 56, 46);
    font('normal', 9.5); doc.setTextColor(222, 218, 255); doc.text('Meesho Profit & Loss Report', M + 56, 62);
    font('bold', 15); ink([255, 255, 255]); doc.text(a(biz), PW - M, 42, { align: 'right' });
    font('normal', 9.5); doc.setTextColor(222, 218, 255);
    doc.text(a(st.gstin ? 'GSTIN ' + st.gstin : 'GSTIN not added'), PW - M, 58, { align: 'right' });
    doc.text(a(per.label), PW - M, 74, { align: 'right' });
    font('normal', 8.5); doc.text(a('Report ' + reportId + '   |   Generated ' + today()), M, 100);
    doc.text(a('Counted by ' + basis + ' (' + per.from + ' to ' + per.to + ')'), PW - M, 100, { align: 'right' });

    /* ---------- headline cards ---------- */
    var y = 138, gap = 8, cols = 3, bw = (CW - (cols - 1) * gap) / cols, bh = 52;
    var cards = [
      ['NET PROFIT', rsx(R.NP), R.NP < 0 ? NEG : POS, R.NR ? pc(R.margin) + ' of net revenue' : ''],
      ['NET SALES', rsx(R.NS), INK, K.sales + ' orders sold'],
      ['RECEIVED FROM MEESHO', rsx(R.payout), INK, 'Settlements, ads and credits'],

      ['MEESHO CHARGES', rsx(-R.MCx), INK, 'Commission, shipping and fees (excl. GST)'],
      ['RTO | RETURN | EXCHANGE', RV ? pc(RV.rtoRate) + ' | ' + pc(RV.retRate) + ' | ' + pc(RV.exchRate) : (K.parcels ? pc(R.returnRate) : '-'), INK, RV ? 'Lost on these: ' + rsx(RV.loss) : '']
    ];
    cards.forEach(function (c, i) {
      var x = M + (i % cols) * (bw + gap), yy = y + Math.floor(i / cols) * (bh + gap);
      fill(i === 0 ? SOFT : PAPER); stroke(RULE); doc.setLineWidth(0.6); doc.roundedRect(x, yy, bw, bh, 6, 6, 'FD');
      fill(i === 0 ? BRAND : RULE); doc.rect(x, yy + 8, 2.5, bh - 16, 'F');

    });
    var cursor = y + 2 * bh + gap;

    /* ---------- building blocks ---------- */
    var sec = 0;
    function newPage() { doc.addPage(); return 70; }
    function heading(title, sub) {

      stroke(RULE); doc.setLineWidth(0.8); doc.line(M + 26 + doc.getTextWidth(a(title)) + 8, yy - 2, PW - M, yy - 2);
      if (sub) { ink(GREY); font('normal', 8.3); var sl = doc.splitTextToSize(a(sub), CW - 26); doc.text(sl, M + 26, yy + 15); yy += 10.5 * sl.length + 3; }
      return yy + 12;
    }
    function negColour(d) { if (d.section === 'body' && typeof d.cell.raw === 'string' && /^\(.*\)$/.test(d.cell.raw)) d.cell.styles.textColor = NEG; }
    function table(title, sub, hd, rows, numFrom, opt) {
      var sy = heading(title, sub);
      var cs = {}; for (var i = numFrom; i < hd.length; i++) cs[i] = { halign: 'right' };
      doc.autoTable(Object.assign({
        startY: sy, head: [hd.map(a)], body: rows, theme: 'grid', margin: { left: M, right: M, top: 70, bottom: 52 },
        styles: { font: 'helvetica', fontSize: 8.3, cellPadding: { top: 4, bottom: 4, left: 6, right: 6 }, textColor: INK, lineColor: RULE, lineWidth: 0.4, overflow: 'linebreak' },
        headStyles: { fillColor: INDIGO, textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 8 },
        alternateRowStyles: { fillColor: PAPER }, columnStyles: cs, didParseCell: negColour
      }, opt || {}));
      cursor = doc.lastAutoTable.finalY;
    }
    var bold = function (v, extra) { return { content: v, styles: Object.assign({ fontStyle: 'bold' }, extra || {}) }; };
    var twoCol = { columnStyles: { 1: { halign: 'right', cellWidth: 140 } } };

    /* ---------- 1. statement ---------- */
    var sy = heading('Profit and loss statement', 'Sales and charges exclude GST when GST registration is on. Brackets mean a cost or a deduction.');
    var kinds = R.lines.map(function (l) { return l.k; });
    doc.autoTable({
      startY: sy, head: [['Particulars', 'Amount (Rs.)']], body: R.lines.map(function (l) { return l.k === 'sec' ? [{ content: a(l.l), colSpan: 2 }] : [a(l.l), mn(l.v)]; }),
      theme: 'plain', margin: { left: M, right: M, top: 70, bottom: 52 },
      styles: { font: 'helvetica', fontSize: 9.3, cellPadding: { top: 4.2, bottom: 4.2, left: 8, right: 8 }, textColor: INK },
      headStyles: { fontStyle: 'bold', textColor: [255, 255, 255], fillColor: INDIGO, fontSize: 8.3 },
      columnStyles: { 1: { halign: 'right', cellWidth: 140 } },
      didParseCell: function (d) {
        if (d.section !== 'body') return;

        else if (k === 'row') { if (d.column.index === 0) d.cell.styles.cellPadding = { top: 4, bottom: 4, left: 20, right: 8 }; }
        else { d.cell.styles.fontStyle = 'bold'; if (k === 'gp') d.cell.styles.fillColor = PAPER; if (k === 'np') { d.cell.styles.fontSize = 11.5; d.cell.styles.fillColor = SOFT; } }
        if (d.column.index === 1 && k !== 'sec' && R.lines[d.row.index].v < 0) d.cell.styles.textColor = NEG;
      },
      didDrawCell: function (d) {
        if (d.section !== 'body') return;
        var c = d.cell, k = kinds[d.row.index];

        if (d.column.index === 1 && (k === 'tot' || k === 'sub' || k === 'gp' || k === 'np')) { stroke(INK); doc.setLineWidth(0.6); doc.line(c.x + 30, c.y + 1, c.x + c.width, c.y + 1); }
        if (d.column.index === 1 && k === 'np') { stroke(BRAND); doc.setLineWidth(0.8); doc.line(c.x + 30, c.y + c.height - 3, c.x + c.width, c.y + c.height - 3); doc.line(c.x + 30, c.y + c.height - 0.8, c.x + c.width, c.y + c.height - 0.8); }
      }
    });
    cursor = doc.lastAutoTable.finalY;

    /* ---------- 2. money received ---------- */
    table('How profit ties to money received', 'Money received should match the Meesho credits in your bank for the same payment dates.', ['Item', 'Amount (Rs.)'],
      R.bridge.map(function (b) { return b.k ? [bold(a(b.l)), bold(mn(b.v))] : [a(b.l), mn(b.v)]; }), 1, twoCol);

    /* ---------- 3. GST and tax ---------- */
    var taxRows = [];
    if (R.gst) {
      var g = R.gst;
      taxRows = [['Output GST on net sales', mn(g.out)], ['Less: input credit on Meesho charges', mn(-g.itcCh)], ['Less: input credit on ads', mn(-g.itcAds)],
        [bold('Net GST payable'), bold(mn(g.net))], ['Less: TCS already collected by Meesho', mn(-g.tcs)], [bold('GST left to pay in cash'), bold(mn(g.cash))]];
    }
    taxRows.push([bold('Tax deducted by Meesho', { textColor: BRAND }), ''], ['TCS collected under GST', mn(-K.T)], ['TDS under section 194-O', mn(-K.D)]);
    table('GST and tax', (R.gst ? 'Input credit is worked out at 18% on columns Meesho marks as including GST; check it against Meesho\'s monthly tax invoice before filing. ' : 'GST registration is off in Settings, so GST is not split out. ') +
      (R.claim ? 'TCS and TDS are claimable (GST return and Form 26AS), so they are added back to profit.' : 'TCS and TDS are counted as an expense, as chosen in Settings.'), ['Item', 'Amount (Rs.)'], taxRows, 1, twoCol);

    /* ---------- 4. returns, RTO, exchanges ---------- */
    if (RV && RV.done) {
      var G = RV.G, ks = ['rto', 'ret', 'exch'], lab = { rto: 'RTO', ret: 'Customer returns', exch: 'Exchanges', lost: 'Lost' };
      if (G.lost.n) ks.push('lost');
      var rate = { rto: RV.rtoRate, ret: RV.retRate, exch: RV.exchRate, lost: RV.lostRate };
      var line = function (l, f, b) { var r = [b ? bold(l) : l].concat(ks.map(function (k) { var v = f(G[k], k); return b ? bold(v) : v; })); return r; };
      table('Returns, RTO and exchanges', 'RTO and lost rates are of ' + RV.done + ' parcels shipped; return and exchange rates are of ' + RV.delivered + ' orders delivered. Amounts as Meesho cut them (incl. GST).',
        ['', ].concat(ks.map(function (k) { return lab[k]; })), [
          line('Orders', function (g) { return String(g.n); }),
          line('Rate', function (g, k) { return pc(rate[k]); }, true),
          line('Return shipping fee', function (g) { return mn(-g.retFee); }),
          line('Forward shipping', function (g) { return mn(-g.fwdShip); }),
          line('Commission and fees kept', function (g) { return mn(-g.fees); }),
          line('Packing', function (g) { return mn(-g.pack); }),
          line('Stock not resellable', function (g) { return mn(-g.stock); }),
          line('Paid back by Meesho', function (g) { return mn(g.back); }),
          line('Total lost', function (g) { return mn(-g.loss); }, true),
          line('Lost per order', function (g) { return g.n ? mn(-Math.round(g.loss / g.n)) : '-'; })
        ], 1);
    }

    /* ---------- 5. categories ---------- */
    if (HA.categoryRows) {
      var cats = HA.categoryRows();
      if (cats.length) {
        var ct = { NS: 0, p: 0, s: 0 }; cats.forEach(function (c) { ct.NS += c.NS; ct.p += c.profit; ct.s += c.sold; });
        table('Profit by category', 'Categories come from Meesho product names (changeable in the Costs tab). Profit is before ads and other expenses.',
          ['Category', 'SKUs', 'Orders', 'Net sales', 'Profit', 'Margin', 'RTO + returns'],
          cats.map(function (c) { return [a(c.cat), String(c.skus), String(c.sold), mn(c.NS), mn(c.profit), c.NS > 0 ? pc(c.profit / c.NS) : '-', String(c.rto + c.ret)]; })
            .concat([[bold('All categories'), '', bold(String(ct.s)), bold(mn(ct.NS)), bold(mn(ct.p)), bold(ct.NS > 0 ? pc(ct.p / ct.NS) : ''), '']]), 1);
      }
    }

    /* ---------- 6. SKUs ---------- */
    table('Profit by SKU', 'After cost of goods, Meesho charges and packaging; before ads and other expenses. Break-even is the buyer price where the SKU makes zero profit.',
      ['SKU', 'Orders', 'Ret/RTO', 'Net sales', 'Cost of goods', 'Meesho charges', 'Profit', 'Per order', 'Break-even'],
      R.skus.map(function (x) { return [a(x.sku) + (x.pcs > 1 ? ' (' + x.pcs + ' pcs)' : ''), String(x.sold), String(x.retU + x.rto), mn(x.NS), mn(-x.COGS), mn(x.MC), mn(x.contrib), x.sold ? mn(x.perOrder) : '', x.sold ? mn(x.breakEven) : '']; })
        .concat([[{ content: 'Not tied to a SKU (ads, referral, account credits, expenses)', colSpan: 6, styles: { fontStyle: 'bold' } }, bold(mn(R.unalloc), { halign: 'right' }), '', ''],
          [{ content: 'Net profit', colSpan: 6, styles: { fontStyle: 'bold', fillColor: SOFT } }, bold(mn(R.NP), { halign: 'right', fillColor: SOFT }), { content: '', styles: { fillColor: SOFT } }, { content: '', styles: { fillColor: SOFT } }]]), 1);

    /* ---------- 7. months ---------- */
    if (S.MO.length > 1) {
      table('Month by month', 'Counted by ' + basis + '. Monthly expenses are included in each month.', ['Month', 'Net sales', 'Gross profit', 'Meesho charges', 'Ads', 'Expenses', 'Net profit', 'Received'],
        S.MO.map(function (x) { return [E.fmtMonth(x.m), mn(x.NS), mn(x.GP), mn(x.MCx), mn(x.ads), mn(-x.OPEX), bold(mn(x.NP)), mn(x.payout)]; }), 1);
    }

    /* ---------- 8. payouts ---------- */
    table('Payouts by date', 'Every payment date in your files; each should match one Meesho credit in your bank.', ['Payment date', 'Orders', 'Settlements', 'Ads', 'Other', 'Net received'],
      S.PO.map(function (p) { return [p.d || 'No date', String(p.n), mn(p.f), mn(p.ads), mn(p.ref + p.adj), bold(mn(p.net))]; }), 1);

    /* ---------- notes and assumptions ---------- */
    var notes = [
      'Source: Meesho payment report' + (S.H && S.H.ordFiles ? ' and orders report' : '') + '. All totals are reconciled to the paisa with Meesho\'s Final Settlement Amount.',
      'Counted by ' + basis + ', ' + per.from + ' to ' + per.to + '.',
      'Customer returns count as ' + (st.returnDefault === 'ok' ? 'back in stock' : 'not resellable') + ', RTO parcels as ' + (st.rtoDefault === 'ok' ? 'back in stock' : 'not resellable') + ', unless marked otherwise in Reconcile.'
    ];

    if (K.revPend) notes.push(K.revPend + ' returned/RTO orders are not yet reversed by Meesho (' + rsx(K.revPendV) + ' of sales); profit will drop when that is paid out.');
