<style>
:root {
  --paper: #F6F7FB; --sheet: #FFFFFF; --rule: #DCE1F0; --rule-2: #B9C1DD;
  --ink: #1B1F3B; --ink-2: #4A5074; --ink-3: #6F7599;
  --carbon: #2F3490; --carbon-ink: #FFFFFF; --carbon-soft: #E8E9F8; --band: #2F3490;
  --margin: #C8323A; --neg: #B42331; --pos: #16774A; --warn: #8A5200; --warn-bg: #FFF4DF;
  --focus: #5A61E6;
  --f-head: "Anek Latin", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1122; --sheet: #161933; --rule: #2A2F55; --rule-2: #3B4170;
    --ink: #E7E9F7; --ink-2: #B7BBDA; --ink-3: #8F94BA;
    --carbon: #8E95FF; --carbon-ink: #0F1122; --carbon-soft: #232858; --band: #1D2168;
    --margin: #FF6B74; --neg: #FF7A84; --pos: #4CD08F; --warn: #F0B45A; --warn-bg: #2B2410;
    --focus: #A9AEFF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1122; --sheet: #161933; --rule: #2A2F55; --rule-2: #3B4170;
  --ink: #E7E9F7; --ink-2: #B7BBDA; --ink-3: #8F94BA;
  --carbon: #8E95FF; --carbon-ink: #0F1122; --carbon-soft: #232858; --band: #1D2168;
  --margin: #FF6B74; --neg: #FF7A84; --pos: #4CD08F; --warn: #F0B45A; --warn-bg: #2B2410;
  --focus: #A9AEFF; color-scheme: dark;
}
/* inside PakkaBill: its colours and fonts, no header band (PakkaBill has its own) */
:root.embed {
  --paper: #fdf8f3; --sheet: #FFFFFF; --rule: #e2daf2; --rule-2: #cfc4ea;
  --ink: #2a2540; --ink-2: #5c5776; --ink-3: #736e8d;
  --carbon: #5b3fe6; --carbon-ink: #FFFFFF; --carbon-soft: #ece6ff;
  --margin: #c8202a; --neg: #c8202a; --pos: #12714b; --warn: #b26a00; --warn-bg: #fff4df; --focus: #ff7a59;
}
@media (prefers-color-scheme: dark) {
  :root.embed:not([data-theme="light"]) {
    --paper: #110e20; --sheet: #1b1631; --rule: #3a3160; --rule-2: #4a4078;
    --ink: #ece8fb; --ink-2: #bdb5d9; --ink-3: #958db3;
    --carbon: #b3a1ff; --carbon-ink: #140c33; --carbon-soft: #35295e;
    --margin: #ff8a8f; --neg: #ff8a8f; --pos: #74d8a7; --warn: #f0c26a; --warn-bg: #2b2410; --focus: #ff7a59;
  }
}
:root.embed[data-theme="dark"] {
  --paper: #110e20; --sheet: #1b1631; --rule: #3a3160; --rule-2: #4a4078;
  --ink: #ece8fb; --ink-2: #bdb5d9; --ink-3: #958db3;
  --carbon: #b3a1ff; --carbon-ink: #140c33; --carbon-soft: #35295e;
  --margin: #ff8a8f; --neg: #ff8a8f; --pos: #74d8a7; --warn: #f0c26a; --warn-bg: #2b2410; --focus: #ff7a59;
}
:root.embed.pbfonts { --f-head: "PB Hind", "Hind", system-ui, -apple-system, "Segoe UI", sans-serif; --f-body: "PB Hind", "Hind", system-ui, -apple-system, "Segoe UI", sans-serif; }
.embed .band { display: none; }
.embed .tabs { top: 0; }
.embed .only-own { display: none; }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 56px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--f-body); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.2; margin: 0; }
h2 { font-size: 1.3rem; font-weight: 650; }
h3 { font-size: 1.05rem; font-weight: 650; }
p { margin: 0 0 .6em; }
a { color: var(--carbon); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-3); }
.small { font-size: .875rem; }
.neg { color: var(--neg); }
.pos { color: var(--pos); }

/* header band */
.band { background: var(--band); color: #fff; padding: 14px 16px 12px; }
.band-in { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.mark { font-family: var(--f-deva); font-weight: 600; font-size: 1.9rem; line-height: 1; letter-spacing: .01em; }
.brand { display: flex; flex-direction: column; }
.brand b { font-family: var(--f-head); font-weight: 600; font-size: 1.05rem; line-height: 1.1; }
.brand span { font-size: .82rem; opacity: .82; }
.band-biz { margin-left: auto; text-align: right; font-size: .82rem; opacity: .9; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.tabs-wrap { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 6px; padding-right: 8px; }
.tabs-in { flex: 1; min-width: 0; display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 8px; }
.lang-sw { flex: none; display: inline-flex; padding: 2px; border-radius: 999px; background: var(--paper); border: 1px solid var(--rule); }
.lang-sw button { border: 0; background: none; padding: 4px 9px; border-radius: 999px; font-size: .8rem; font-weight: 700; color: var(--ink-3); cursor: pointer; line-height: 1.2; }
.lang-sw button[aria-pressed="true"] { background: var(--carbon); color: var(--carbon-ink); }
html.lang-hi body { line-height: 1.6; }
html.lang-hi body, html.lang-hi button, html.lang-hi input, html.lang-hi select { font-family: var(--f-body), "Noto Sans Devanagari", "Nirmala UI", "Mangal", sans-serif; }
.tabs-in::-webkit-scrollbar { display: none; }
.tab { flex: none; background: none; border: 0; padding: 13px 12px 11px; font-weight: 600; font-size: .95rem; color: var(--ink-3); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--carbon); }
.tab .dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--margin); color: #fff; font-size: .72rem; line-height: 18px; text-align: center; }

main { max-width: 860px; margin: 0 auto; padding: 16px 14px 48px; }
.panel[hidden] { display: none; }
.stack > * + * { margin-top: 14px; }

.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: 16px; }
.sheet-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.sheet-h p { margin: 0; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--rule-2); background: var(--sheet); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--carbon); }
.btn.pri { background: var(--carbon); border-color: var(--carbon); color: var(--carbon-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sm { min-height: 34px; padding: 4px 10px; font-size: .88rem; }
.btn.link { border: 0; background: none; color: var(--carbon); padding: 4px 2px; min-height: 0; text-decoration: underline; text-underline-offset: 2px; }
.btn.danger { color: var(--neg); }
.btn[disabled] { opacity: .55; cursor: progress; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 auto; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .88rem; color: var(--ink-2); font-weight: 600; }
.inp, select.inp { min-height: 42px; padding: 8px 10px; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--sheet); width: 100%; }
.inp.money { text-align: right; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 8px 12px; min-height: 40px; font-weight: 600; font-size: .9rem; color: var(--ink-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule-2); }
.seg button[aria-pressed="true"] { background: var(--carbon); color: var(--carbon-ink); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .95rem; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--carbon); }
.fgrid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .fgrid { grid-template-columns: 1fr 1fr; } }

/* data steps */
.steps { list-style: none; counter-reset: st; margin: 0; padding: 0; }
.steps li { counter-increment: st; position: relative; padding: 0 0 14px 44px; }
.steps li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--carbon); color: var(--carbon); font: 700 .95rem/27px var(--f-head); text-align: center; }
.steps li.done::before { background: var(--carbon); color: var(--carbon-ink); content: "\2713"; }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 14.5px; top: 34px; bottom: 4px; width: 1px; background: var(--rule-2); }
.steps .st { display: block; font-family: var(--f-head); font-weight: 600; }
.steps p { margin: 2px 0 0; color: var(--ink-2); font-size: .95rem; }
.drop { display: block; border: 2px dashed var(--rule-2); border-radius: 8px; padding: 22px 16px; text-align: center; cursor: pointer; background: var(--paper); }
.drop:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.drop:hover, .drop.over { border-color: var(--carbon); background: var(--carbon-soft); }
.drop b { display: block; font-family: var(--f-head); font-size: 1.1rem; }
.file { border-top: 1px solid var(--rule); padding: 12px 0; }
.file:first-child { border-top: 0; }
.file-h { display: flex; gap: 10px; align-items: flex-start; }
.file-h b { word-break: break-all; }
.sheets { margin: 6px 0 0; padding: 0; list-style: none; font-size: .9rem; color: var(--ink-2); }
.sheets li { padding: 2px 0; }
.tick { color: var(--pos); font-weight: 700; }
.cross { color: var(--neg); font-weight: 700; }

/* callouts */
.note { border-left: 3px solid var(--warn); background: var(--warn-bg); padding: 10px 12px; border-radius: 0 6px 6px 0; font-size: .93rem; }
.note.info { border-left-color: var(--carbon); background: var(--carbon-soft); }
.note.bad { border-left-color: var(--neg); }
.note p:last-child { margin: 0; }
.demo-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* period bar */
.period { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .period { grid-template-columns: 1fr auto; align-items: end; } }
.dl { display: flex; gap: 8px; flex-wrap: wrap; }
.lock { display: grid; overflow: hidden; padding: 0; }
.lock > * { grid-area: 1 / 1; }
.lk-sk { padding: 22px; filter: blur(3px); opacity: .55; }
.lk-row { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.lk-row i { display: block; height: 11px; border-radius: 6px; background: var(--ink-3); opacity: .35; }
.lk-box { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; background: linear-gradient(180deg, color-mix(in srgb, var(--sheet) 55%, transparent), var(--sheet) 55%); }
.lk-box h2 { margin: 6px 0 4px; font-size: 1.25rem; }
.lk-box p { margin: 0 0 8px; color: var(--ink-2); max-width: 440px; }
.lk-box ul { text-align: left; margin: 4px 0 14px; padding-left: 20px; color: var(--ink-2); font-size: .92rem; }
.lk-ic { font-size: 1.8rem; }
.btn.wa { background: #1faa59; border-color: #1faa59; color: #fff; }
.vs { font-size: .82rem; font-weight: 700; flex-basis: 100%; }
.vs.up { color: var(--pos, #12714b); } .vs.down { color: var(--neg, #c8202a); }
.lnk { background: none; border: 0; color: var(--ink-3); cursor: pointer; text-decoration: underline; padding: 4px; font: inherit; }
.nx { padding: 16px 18px; }
.nx-h { display: flex; align-items: center; gap: 14px; }
.nx-ring { position: relative; flex: none; width: 48px; height: 48px; }
.nx-ring svg { width: 48px; height: 48px; transform: rotate(-90deg); }
.nx-ring circle { fill: none; stroke-width: 5; }
.nx-ring .bg { stroke: var(--rule); }
.nx-ring .fg { stroke: url(#nxg); stroke-linecap: round; transition: stroke-dasharray .4s; }
.nx-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-head); font-size: .9rem; }
.nx-ht { flex: 1; min-width: 0; }
.nx-ht h2 { font-size: 1.1rem; }
.nx-ht p { margin: 2px 0 0; color: var(--ink-3); font-size: .9rem; }
.nx-x { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-3); font-size: 1.1rem; line-height: 1; cursor: pointer; }
.nx-x:hover { color: var(--ink); border-color: var(--rule-2); }
.nx-l { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.nx-l li { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--paper); }
.nx-l li.first { border-color: var(--carbon); background: var(--carbon-soft); }
.nx-n { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .82rem; font-weight: 800; background: var(--sheet); border: 1.5px solid var(--rule-2); color: var(--ink-2); }
.nx-l li.first .nx-n { background: var(--carbon); border-color: var(--carbon); color: var(--carbon-ink); }
.nx-t { flex: 1; min-width: 0; }
.nx-t b { display: block; font-weight: 650; line-height: 1.3; }
.nx-t small { display: block; color: var(--ink-3); font-size: .84rem; line-height: 1.35; margin-top: 2px; }
.nx-t em { font-style: normal; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); border: 1px solid var(--rule-2); border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: 1px; }
.nx-l .btn { flex: none; }
.nx-done { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.nx-done span { display: inline-flex; align-items: center; gap: 5px; font-size: .8rem; font-weight: 600; color: var(--pos); background: color-mix(in srgb, var(--pos) 10%, transparent); border-radius: 999px; padding: 3px 10px 3px 6px; }
.nx-done span::before { content: "\2713"; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--pos); color: #fff; font-size: .66rem; font-weight: 800; }
@media (max-width: 560px) { .nx { padding: 14px; } .nx-l li { flex-wrap: wrap; row-gap: 8px; } .nx-t { flex: 1 1 calc(100% - 40px); } .nx-l .btn { margin-left: 38px; } }
.dl .btn { flex: 1 1 130px; padding-left: 12px; padding-right: 12px; }
@media (min-width: 620px) { .dl .btn { flex: 0 0 auto; white-space: nowrap; } }

/* KPI slip */
.slip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
.slip > div { background: var(--sheet); padding: 10px 12px; }
.slip .np { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.slip small { display: block; color: var(--ink-3); font-size: .82rem; font-weight: 600; }
.slip strong { font-family: var(--f-head); font-weight: 600; font-size: 1.15rem; }
.slip .np strong { font-size: 1.9rem; line-height: 1.1; }
@media (min-width: 620px) { .slip { grid-template-columns: repeat(4, 1fr); } .slip > div:nth-last-child(-n+2):not(.np) { grid-column: span 2; } }

/* returns, RTO and exchanges */
.rv-total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 10px 14px; margin-bottom: 12px; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; font-weight: 600; color: var(--ink-2); }
.rv-total b { font-family: var(--f-head); font-size: 1.4rem; }
.rv-cards { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 620px) { .rv-cards { grid-template-columns: repeat(3, 1fr); } }
.rv-card { --acc: var(--carbon); border: 1px solid var(--rule); border-top: 4px solid var(--acc); border-radius: 6px; padding: 12px 14px; background: var(--sheet); min-width: 0; }
.rv-rto { --acc: var(--warn); } .rv-ret { --acc: var(--neg); } .rv-exch { --acc: var(--carbon); } .rv-lost { --acc: var(--ink-3); }
.rv-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.rv-top b { display: block; font-family: var(--f-head); font-size: 1.1rem; }
.rv-top small { display: block; color: var(--ink-3); font-size: .8rem; }
.rv-top strong { font-family: var(--f-head); font-size: 1.8rem; line-height: 1; color: var(--acc); }
.rv-bar { height: 6px; background: var(--paper); border-radius: 99px; margin: 10px 0 6px; overflow: hidden; }
.rv-bar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; }
.rv-of { margin: 0 0 10px; font-size: .85rem; color: var(--ink-2); }
.rv-money { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dashed var(--rule); padding-top: 10px; font-weight: 600; }
.rv-money b { font-family: var(--f-head); font-size: 1.2rem; }
.rv-per { margin: 2px 0 0; font-size: .8rem; color: var(--ink-3); text-align: right; }
.rv-lines { list-style: none; margin: 8px 0 0; padding: 0; font-size: .85rem; }
.rv-lines li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; color: var(--ink-2); }
.rv-sub { margin-top: 12px; }
.rv-sub > summary { cursor: pointer; font-weight: 600; }
.rv-notes { margin: 8px 0 0; padding-left: 18px; font-size: .85rem; color: var(--ink-3); }
.rv-notes li { margin: 3px 0; }

/* "Know your real profit" banner */
.hero { position: relative; overflow: hidden; border-radius: 16px; padding: 22px 22px 20px; color: #fff; background: linear-gradient(125deg, #26307f 0%, #4b3bd6 52%, #7c56ee 100%); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: center; box-shadow: 0 14px 36px -22px rgba(40, 30, 140, .8); }
.hero.has-kpi { grid-template-columns: minmax(0, 1fr) minmax(220px, 280px); }
.hero::before { content: ""; position: absolute; left: -80px; bottom: -120px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(120, 200, 255, .22), rgba(120, 200, 255, 0) 70%); pointer-events: none; }
.hero::after { content: ""; position: absolute; right: -70px; top: -90px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 122, 89, .5), rgba(255, 122, 89, 0) 70%); pointer-events: none; }
.hero-t { position: relative; z-index: 1; min-width: 0; }
.hero-k { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 8px; padding: 3px 10px 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, .14); font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.hero-k i { width: 7px; height: 7px; border-radius: 50%; background: #5cf2a6; box-shadow: 0 0 0 3px rgba(92, 242, 166, .25); }
.hero h1 { margin: 0; font-family: var(--f-head); font-size: clamp(1.6rem, 4.6vw, 2.1rem); line-height: 1.08; color: #fff; letter-spacing: -.01em; }
.hero.big h1 { font-size: clamp(1.9rem, 5.4vw, 2.5rem); }
.hero-s { margin: 8px 0 0; font-size: .95rem; line-height: 1.45; opacity: .9; max-width: 520px; }
.hero-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.hero-btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(255, 255, 255, .45); background: rgba(255, 255, 255, .12); color: #fff; border-radius: 999px; padding: 8px 14px 8px 10px; font: inherit; font-weight: 700; font-size: .88rem; cursor: pointer; }
.hero-btn svg { width: 18px; height: 18px; flex: none; }
.hero-btn:hover { background: rgba(255, 255, 255, .22); }
.hero-btn.solid { background: #fff; color: #2f2a8a; border-color: #fff; padding-left: 14px; }
.hero-kpi { position: relative; z-index: 1; background: rgba(255, 255, 255, .96); color: #1b1f3b; border-radius: 14px; padding: 14px 16px; box-shadow: 0 10px 30px -14px rgba(10, 5, 60, .6); }
.hk-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hk-top span { font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #6f7599; }
.hk-chip { font-style: normal; font-size: .74rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #e3f6ec; color: #16774a; white-space: nowrap; }
.hk-chip.neg { background: #fde8ea; color: #b42331; }
.hero-kpi b { display: block; margin-top: 2px; font-family: var(--f-head); font-size: 2rem; line-height: 1.15; color: #16774a; letter-spacing: -.01em; }
.hero-kpi b.neg { color: #b42331; }
.hero-kpi small { display: block; margin-top: 2px; font-size: .8rem; color: #4a5074; }
.hero-kpi .vs { display: block; margin-top: 6px; font-size: .8rem; }
@media (max-width: 620px) { .hero.has-kpi { grid-template-columns: minmax(0, 1fr); } .hero { padding: 18px 16px 16px; } }
@media print { .hero { display: none; } }

/* How to use */
.g-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.g-card { display: grid; gap: 14px; }
@media (min-width: 720px) { .g-card { grid-template-columns: 340px 1fr; } .g-bar { grid-column: 1 / -1; } }
.g-art svg { width: 100%; height: auto; display: block; border-radius: 12px; background: var(--paper); }
.g-num { margin: 0; font-size: .78rem; font-weight: 700; color: var(--carbon); text-transform: uppercase; letter-spacing: .06em; }
.g-body h3 { margin: 4px 0 8px; font-size: 1.2rem; }
.g-body p { margin: 0; line-height: 1.6; }
.g-prog { height: 5px; border-radius: 99px; background: var(--rule); overflow: hidden; margin-bottom: 10px; }
.g-prog i { display: block; height: 100%; background: linear-gradient(90deg, #2b3494, #5b3fe6, #ff7a59); transition: width .3s; }
.g-ctl { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
.g-dots { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
.g-dot { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; background: var(--rule); cursor: pointer; }
.g-dot.on { background: var(--carbon); width: 22px; border-radius: 99px; }
.g-terms { margin: 10px 0 0; display: grid; gap: 4px 16px; }
.g-terms dt { font-weight: 700; margin-top: 8px; }
.g-terms dd { margin: 0; color: var(--ink-2); }
@media (min-width: 720px) { .g-terms { grid-template-columns: 240px 1fr; } .g-terms dt { margin-top: 0; } }

/* the ledger */
.ledger { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: 0 0 6px; overflow: hidden; }
.ledger::before { content: ""; position: absolute; top: 0; bottom: 0; left: 22px; width: 0; border-left: 1.5px solid var(--margin); opacity: .85; }
.ledger::after { content: ""; position: absolute; top: 0; bottom: 0; left: 26px; width: 0; border-left: 1px solid var(--margin); opacity: .45; }
.lg-title { padding: 14px 14px 10px 40px; border-bottom: 1.5px solid var(--rule-2); }
.lg-title h2 { font-size: 1.15rem; }
.lg-title p { margin: 2px 0 0; font-size: .88rem; color: var(--ink-3); }
.lg-head, .lg-row, .lg-sec, .lg-tot { display: flex; justify-content: space-between; gap: 12px; padding: 7px 14px 7px 40px; border-bottom: 1px solid var(--rule); }
.lg-head { font-size: .8rem; color: var(--ink-3); font-weight: 600; padding-top: 6px; padding-bottom: 6px; }
.lg-sec { font-family: var(--f-head); font-weight: 600; color: var(--carbon); padding-top: 14px; font-size: 1rem; }
.lg-row span:first-child { padding-left: 12px; color: var(--ink-2); }
.lg-tot { font-weight: 700; }
.lg-tot.sub { font-weight: 600; }
.lg-tot .amt { border-top: 1px solid var(--ink-3); padding-top: 2px; margin-top: -3px; }
.lg-tot.gp { background: var(--carbon-soft); }
.lg-tot.np { font-family: var(--f-head); font-size: 1.2rem; font-weight: 700; padding-top: 12px; padding-bottom: 12px; border-bottom: 0; }
.lg-tot.np .amt { border-top: 1.5px solid var(--ink); border-bottom: 4px double var(--margin); padding-bottom: 1px; }
.amt { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.lg-foot { padding: 8px 14px 4px 40px; font-size: .85rem; color: var(--ink-3); }

/* tables */
.tw { overflow-x: auto; border: 1px solid var(--rule); border-radius: 3px; background: var(--sheet); }
table.t { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.t th, table.t td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
table.t th { font-weight: 600; color: var(--ink-2); background: var(--paper); white-space: nowrap; font-size: .82rem; }
table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
table.t tr.tot td { font-weight: 700; border-top: 1.5px solid var(--rule-2); }
table.t tr.np td { font-weight: 700; }
table.t input.inp { min-height: 36px; padding: 6px 8px; min-width: 88px; }
details.more > summary { cursor: pointer; font-weight: 600; font-family: var(--f-head); list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "+"; font-size: 1.3rem; line-height: 1; color: var(--ink-3); }
details.more[open] > summary::after { content: "\2212"; }
details.more[open] > summary { margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: .93rem; }
.kv > span:nth-child(2n) { text-align: right; }
.kv .b { font-weight: 700; border-top: 1px solid var(--rule-2); padding-top: 4px; }

/* reconcile */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: none; border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 999px; padding: 6px 12px; font-size: .88rem; font-weight: 600; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.chip span { color: var(--ink-3); font-weight: 600; margin-left: 4px; }
.chip[aria-pressed="true"] { background: var(--carbon); border-color: var(--carbon); color: var(--carbon-ink); }
.chip[aria-pressed="true"] span { color: inherit; opacity: .85; }
.chip.alert:not([aria-pressed="true"]) { border-color: var(--margin); color: var(--neg); }
.olist { background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; }
.ord { padding: 10px 12px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }
.ord:last-child { border-bottom: 0; }
.ord .id { font-weight: 700; word-break: break-all; }
.ord .pn { color: var(--ink-2); font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ord .meta { color: var(--ink-3); font-size: .85rem; }
.ord .right { text-align: right; grid-row: 1 / span 2; grid-column: 2; }
.ord .right b { display: block; }
.ord .full { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.tag { display: inline-block; font-size: .78rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--carbon-soft); color: var(--ink-2); }
.tag.bad { background: transparent; border: 1px solid var(--margin); color: var(--neg); }
.tag.good { background: transparent; border: 1px solid var(--pos); color: var(--pos); }
.cond { min-height: 34px; padding: 4px 8px; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--sheet); font-size: .88rem; }
.cond.def { border-style: dashed; }

/* costs */
.clist .crow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 8px; align-items: end; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.clist .crow:last-child { border-bottom: 0; }
.clist .crow.miss { box-shadow: inset 3px 0 0 var(--margin); padding-left: 10px; }
.clist .crow .info { grid-column: 1 / -1; min-width: 0; }
.clist .crow .ccat { grid-column: 1 / -1; }
.fill-seg { flex-wrap: wrap; }
.clist .crow .sku { font-weight: 700; word-break: break-all; }
.clist .crow .sub { font-size: .84rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clist .crow label { display: flex; flex-direction: column; gap: 3px; font-size: .76rem; font-weight: 600; color: var(--ink-3); min-width: 0; }
.clist .crow .inp { min-height: 38px; padding: 6px 8px; min-width: 0; width: 100%; }
@media (min-width: 620px) {
  .clist .crow { grid-template-columns: minmax(0, 1fr) 120px 70px 100px 170px; }
  .clist .crow .info { grid-column: auto; align-self: center; }
  .clist .crow .ccat { grid-column: auto; }
}

/* expenses */
.exp { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.exp:last-child { border-bottom: 0; }

.toast { position: fixed; left: 16px; right: 16px; margin: 0 auto; width: fit-content; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: .92rem; max-width: calc(100% - 32px); box-shadow: 0 4px 18px rgba(20, 22, 60, .25); z-index: 20; }
.toast[hidden] { display: none; }
.busy { position: fixed; inset: 0; background: rgba(15, 17, 34, .35); display: flex; align-items: center; justify-content: center; z-index: 30; }
.busy[hidden] { display: none; }
.busy div { background: var(--sheet); color: var(--ink); padding: 16px 20px; border-radius: 8px; font-weight: 600; }
.empty { text-align: center; padding: 28px 12px; }
.empty h2 { margin-bottom: 6px; }
@media (prefers-reduced-motion: no-preference) {
  .ledger .lg-tot.np .amt { transition: color .2s; }
}
@media print {
  .band, .tabs, .no-print, .toast { display: none !important; }
  body { background: #fff; }
}

/* Hisaab engine: Meesho payment-report parsing, calibration, P&L and reconciliation.

(function (root, factory) {
  var E = factory();
  if (typeof module === 'object' && module.exports) module.exports = E; else root.HE = E;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------------- text, numbers, dates ---------------- */
  function txt(v) { return String(v == null ? '' : v).replace(/[\u00a0\s]+/g, ' ').trim(); }
  function h(v) { return txt(v).toLowerCase(); }
  function slug(v) { return h(v).replace(/%/g, ' pct').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'col'; }

  function cleanNum(v) {
    if (v == null) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    if (typeof v === 'boolean') return null;
    var s = String(v).trim();
    if (!s) return null;
    s = s.replace(/[\u2212\u2012\u2013\u2014]/g, '-');
    var neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1).trim(); }
    // bank-style "12.50 Dr" is money out, "12.50 Cr" money in
    var dc = /^(.*?)\s*(dr|cr)\.?$/i.exec(s);
    if (dc && /\d/.test(dc[1])) { if (dc[2].toLowerCase() === 'dr') neg = !neg; s = dc[1]; }
    s = s.replace(/\u20b9|rs\.?|inr/gi, '').replace(/[,\s\u00a0]/g, '').replace(/%$/, '');
    if (/^[0-9.]+-$/.test(s)) { neg = !neg; s = s.slice(0, -1); }
    if (!/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s)) return null;
    var n = parseFloat(s);
    if (!isFinite(n)) return null;
    return neg ? -n : n;

        var rq = indexedDB.open('pakkabill', 1);
        rq.onupgradeneeded = function () { rq.transaction.abort(); }; // never create PakkaBill's database from here
        rq.onerror = function () { fin(null); };
        rq.onsuccess = function () {
          var db = rq.result;
          try { var g = db.transaction('kv').objectStore('kv').get('business'); g.onsuccess = function () { fin(g.result || null); db.close(); }; g.onerror = function () { fin(null); db.close(); }; }
          catch (e) { db.close(); fin(null); }
        };
      } catch (e) { fin(null); }
    }).then(function (b) {
      if (b) return b;
      try { return JSON.parse(localStorage.getItem('pakkabill:business') || 'null'); } catch (e) { return null; }
    });
  }
  function shopDefaults() {
    return readShop().then(function (b) {
      if (!b) return;
      var st = S.real.settings, changed = false;
      if (!st.biz && String(b.name || '').trim()) { st.biz = String(b.name).trim(); changed = true; }
      if (!st.gstin && String(b.gstin || '').trim()) { st.gstin = String(b.gstin).trim().toUpperCase(); changed = true; }
      if (changed && !S.demo) render();
    });
  }

  /* ---------------- boot ---------------- */
  async function boot() {
    if (EMBED) { followParentTheme(); useParentFonts(); }
    else { var th = lsGet('theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); }
    loadLocal();
    recompute();
    var t0 = ''; try { t0 = sessionStorage.getItem(LS + 'tab') || ''; } catch (e) { t0 = ''; }
    S.tab = 'data'; render();
    var files = await idbGet('files');
    if (Array.isArray(files) && files.length && !S.demo) { S.real.files = files; recompute(); }
    S.tab = (t0 && TABS.some(function (t) { return t[0] === t0; })) ? t0 : (hasData() ? 'pl' : 'data');
    if (!hasData() && (S.tab === 'pl' || S.tab === 'rc')) S.tab = 'data';
    render();
    if (EMBED) shopDefaults(); else initRemote();
  }
  A.boot = boot;
})();

<script>
/* Hisaab views: each returns an HTML string. Every value from a file goes through esc(). */
(function () {
  'use strict';
  var E = window.HE, A = window.HA, S = A.S, esc = A.esc;
  var V = A.V = {};

  function mny(p) { return E.money(p, { paren: true }); }
  function amt(p) { return '<span class="amt' + (p < 0 ? ' neg' : '') + '">' + mny(p) + '</span>'; }
  function rs(p, np) { return E.money(p, { sym: '\u20b9', noPaise: !!np }); }
  function pct(x) { return (x * 100).toFixed(1) + '%'; }
  function pct0(x) { var v = x * 100; return (v >= 10 || v === 0 ? Math.round(v) : v.toFixed(1)) + '%'; }
  function fd(d) { return d ? E.fmtDate(d) : ''; }
  function pl(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function condWord(c) { return c === 'ok' ? 'back in stock' : 'not resellable'; }
  function packMode(st) { var v = st.packFromSku; return v === true || v === 'sku' ? 'sku' : v === false || v === 'name' ? 'name' : 'auto'; }
  function packSel(st) {
    var cur = packMode(st);
    return '<select class="inp" data-ch="set" data-k="packFromSku">' + [['auto', 'Automatic'], ['name', 'From the product name'], ['sku', 'From the SKU letters (BPYG05 = 4)']].map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === cur ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>';
  }
  function packNote(st) {
    var M = S.M, pk = M && M.pk, rule = E.packRule(st, M), mode = packMode(st);
    var sku = 'When the product name says the size ("Pack of 5"), that is used. Otherwise each letter before the number in the SKU is a piece and a colour in brackets is one more (BPYG05 = 4, PGWM(GREY)05 = 5, G21 = 1); the number is ignored.';
    var name = 'Read from the product name, like "Combo of 2" or "Pack of 5"; anything else counts as 1 piece.';
    if (mode !== 'auto') return rule === 'sku' ? sku : name;
    if (rule === 'sku') return 'Automatic: your SKUs follow the letters rule (' + pk.agree + ' of ' + pk.stated + ' combo names agree). ' + sku;
    return 'Automatic: ' + name;
  }
  A.packNote = packNote; // the Excel export (HX) prints it too

  function demoBar() {
    if (!S.demo) return '';
    return '<div class="note info demo-bar no-print"><p class="grow" style="margin:0">You are looking at sample data for a blouse and track pant store. Nothing here is saved.</p>' +
      '<button class="btn sm" data-act="endDemo">Close sample</button></div>';
  }
  function empty() {
    return hero(true) + '<section class="sheet empty"><h2>See your real profit in 2 minutes</h2><p class="muted">Upload the payment report from the Meesho Supplier Panel. PakkaBill takes out every fee, return, RTO, GST and product cost, and shows what you really earned. Or look around with sample data first.</p>' +
      '<div class="row" style="justify-content:center"><button class="btn pri" data-act="tab" data-tab="data">Upload files</button><button class="btn" data-act="demo">Try with sample data</button></div></section>';
  }
  /* PakkaBill's promise, at the top of the P&L */
  function hero(big) {

    if (R && !big) {
      kpi = '<div class="hero-kpi"><div class="hk-top"><span>' + (R.NP < 0 ? 'Real loss' : 'Real profit') + '</span>' +
        (R.NR ? '<em class="hk-chip' + (R.NP < 0 ? ' neg' : '') + '">' + pct(R.margin) + ' margin</em>' : '') + '</div>' +
        '<b class="' + (R.NP < 0 ? 'neg' : '') + '">' + rs(R.NP, true) + '</b><small>' + esc(S.per.label) + '</small>' + vsPrev() + '</div>';
    }

    return '<section class="hero' + (big ? ' big' : '') + (kpi ? ' has-kpi' : '') + '"><div class="hero-t"><p class="hero-k"><i aria-hidden="true"></i>PakkaBill Profit &amp; Loss</p>' +
      '<h1>Know your real profit</h1>' +
      '<p class="hero-s">Every Meesho fee, return, RTO, GST and product cost taken out. Reconciled to the paisa.</p>' +
      '<div class="hero-acts">' + (big ? '<button class="hero-btn solid" data-act="tab" data-tab="data">Upload files</button>' : '') +
      '<button class="hero-btn" data-act="tab" data-tab="guide">' + play + 'How to use</button></div></div>' + kpi + '</section>';
  }

  function kv(pairs) {
    return '<div class="kv">' + pairs.map(function (p) {

    }).join('') + '</div>';

  /* ---------------- Returns, RTO and exchanges ---------------- */
  function returnsHtml() {
    var RV = S.RV, per = S.per;
    if (!RV || !RV.done) return '';
    var G = RV.G, ks = ['rto', 'ret', 'exch'], hasLost = G.lost.n > 0;
    if (hasLost) ks.push('lost');
    var HEAD = { rto: 'RTO', ret: 'Returns', exch: 'Exchanges', lost: 'Lost' };
    var SUB = { rto: 'Came back undelivered', ret: 'Customer sent it back', exch: 'Swapped for size or colour', lost: 'Lost by the courier' };
    var OF = { rto: [RV.rtoRate, RV.done, 'shipped'], ret: [RV.retRate, RV.delivered, 'delivered'], exch: [RV.exchRate, RV.delivered, 'delivered'], lost: [RV.lostRate, RV.done, 'shipped'] };
    function rupee(v) { return rs(Math.round(v), true); }
    function card(k) {
      var g = G[k], o = OF[k], lines = [
        ['Return shipping fee', g.retFee], ['Forward shipping', g.fwdShip], ['Meesho fees kept', g.fees],
        ['Packing', g.pack], ['Stock not resellable', g.stock], ['Paid back by Meesho', -g.back]
      ].filter(function (l) { return Math.round(l[1]); });
      return '<div class="rv-card rv-' + k + '"><div class="rv-top"><div><b>' + HEAD[k] + '</b><small>' + SUB[k] + '</small></div><strong>' + pct(o[0]) + '</strong></div>' +
        '<div class="rv-bar"><i style="width:' + Math.min(100, o[0] * 100).toFixed(1) + '%"></i></div>' +
        '<p class="rv-of">' + g.n + ' of ' + o[1] + ' orders ' + o[2] + '</p>' +
        '<div class="rv-money"><span>Money lost</span><b class="' + (g.loss > 0 ? 'neg' : '') + '">' + rupee(g.loss) + '</b></div>' +
        (g.n && g.loss ? '<p class="rv-per">' + rupee(g.loss / g.n) + ' per order</p>' : '') +
        (lines.length ? '<ul class="rv-lines">' + lines.map(function (l) { return '<li><span>' + l[0] + '</span><span class="' + (l[1] < 0 ? 'pos' : '') + '">' + (l[1] < 0 ? '+ ' : '') + rupee(Math.abs(l[1])) + '</span></li>'; }).join('') + '</ul>'
          : '<p class="rv-per">' + (k === 'exch' ? 'Still a sale, no extra fee' : 'No fees charged') + '</p>') +
        '</div>';
    }
    var h = '<div class="rv-total"><span>Total money lost</span><b class="' + (RV.loss > 0 ? 'neg' : '') + '">' + rupee(RV.loss) + '</b></div>' +
      '<div class="rv-cards">' + ks.map(card).join('') + '</div>';
    var notes = ['RTO' + (hasLost ? ' and lost' : '') + ' rates are of parcels shipped; return and exchange rates are of orders delivered.', 'Money lost is what Meesho cut from your payout for these orders (including GST), plus packing and stock you could not resell, less what Meesho paid back.'];
    if (G.exch.n) notes.push('Exchanges are still sales, so only extra return or exchange fees count as lost.');
    if (G.ret.pending || G.rto.pending) notes.push(pl(G.ret.pending + G.rto.pending, 'order') + ' are marked returned or RTO but Meesho has not taken the sale back yet, so some fees may still come.');
    var np = G.rto.noPay + G.ret.noPay + G.exch.noPay;
    if (np) notes.push(pl(np, 'order') + ' have no payment row yet, so their fees are not counted.');
    if (RV.transit) notes.push(pl(RV.transit, 'order') + ' still in transit are left out.');
    notes.push('RTO parcels and returns count as back in stock unless marked Not resellable in Reconcile or Settings. Counted by ' + (per.basis === 'order' ? 'order date' : 'payment date') + '.');
    h += '<details class="rv-sub"><summary>How this is counted</summary><ul class="rv-notes">' + notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></details>';
    var cols = RV.cols.filter(function (c) { return c.rto || c.ret || c.exch || c.lost; });
    if (cols.length) {
      h += '<details class="rv-sub"><summary>Each Meesho fee on returns and RTO</summary><div class="tw"><table class="t"><thead><tr><th>Column in Meesho file</th>' + ks.map(function (k) { return '<th class="n">' + HEAD[k] + '</th>'; }).join('') + '</tr></thead><tbody>' +
        cols.map(function (c) { return '<tr><td>' + esc(c.label) + '</td>' + ks.map(function (k) { return '<td class="n">' + (c[k] ? amt(c[k]) : '–') + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table></div><p class="small muted" style="margin:6px 0 0">Minus is money Meesho took; plus is money it gave back on these orders.</p></details>';
    }
    if (RV.skus.length) {
      var more = RV.skus.length > 25;
      h += '<details class="rv-sub"><summary>RTO, returns and exchanges by SKU</summary><div class="tw"><table class="t"><thead><tr><th>SKU</th><th class="n">Shipped</th><th class="n">RTO</th><th class="n">Returns</th><th class="n">Exchanges</th><th class="n">Money lost</th></tr></thead><tbody>' +
        RV.skus.slice(0, 25).map(function (x) {
          function c(n, r) { return n ? n + ' <span class="small muted">(' + pct0(r) + ')</span>' : '–'; }
          return '<tr><td><b>' + esc(x.sku) + '</b>' + (x.pn ? '<div class="small muted">' + esc(x.pn) + '</div>' : '') + '</td><td class="n">' + x.done + '</td><td class="n' + (x.rtoRate >= 0.25 ? ' neg' : '') + '">' + c(x.rto + x.lost, x.rtoRate) + '</td><td class="n' + (x.retRate >= 0.25 ? ' neg' : '') + '">' + c(x.ret, x.retRate) + '</td><td class="n">' + c(x.exch, x.exchRate) + '</td><td class="n">' + (x.loss ? '<span class="neg">' + mny(-x.loss) + '</span>' : '–') + '</td></tr>';
        }).join('') + '</tbody></table></div><p class="small muted" style="margin:6px 0 0">Red is 25% or more. ' + (more ? 'Showing the 25 SKUs that lose the most; the Excel download has all of them. ' : '') + 'A high RTO rate often means buyers change their mind before delivery (try fewer COD orders to far pincodes); a high return rate usually points to size, colour or quality not matching the photos.</p></details>';
    }
    return '<details class="sheet more" open><summary>Returns, RTO and exchanges</summary>' + h + '</details>';
  }
  A.returnsHtml = returnsHtml;

  /* ---------------- Profit by category ---------------- */
  function categoryRows() {
    var R = S.R, RV = S.RV, m = {};
    function row(k) { return m[k] || (m[k] = { cat: k, skus: 0, sold: 0, NS: 0, profit: 0, done: 0, delivered: 0, rto: 0, ret: 0, loss: 0 }); }
    R.skus.forEach(function (x) { var r = row(A.catOf(x.sku, x.pn)); r.skus++; r.sold += x.sold; r.NS += x.NS; r.profit += x.contrib; });
    (RV ? RV.skus : []).forEach(function (x) { var r = row(A.catOf(x.sku, x.pn)); r.rto += x.rto + x.lost; r.ret += x.ret; r.loss += x.loss; });
    return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return b.NS - a.NS; });
  }
  A.categoryRows = categoryRows;
  function categoryHtml() {
    var rows = categoryRows();
    if (!rows.length) return '';
    var tot = { NS: 0, profit: 0 }; rows.forEach(function (r) { tot.NS += r.NS; tot.profit += r.profit; });

    }).join('');

      '<tr class="tot"><td>All categories</td><td class="n"><b>' + mny(tot.profit) + '</b></td><td class="n">' + (tot.NS > 0 ? pct(tot.profit / tot.NS) : '') + '</td><td class="n">' + mny(tot.NS) + '</td><td></td><td></td><td></td></tr></tbody></table></div>' +
      '<p class="small muted" style="margin:8px 0 0">Categories come from a Category column in your uploaded files when there is one (for example Meesho\u2019s catalogue download), otherwise from Meesho\u2019s product names. Change any SKU\u2019s category in the Costs tab. Profit is before ads and other expenses, like Profit by SKU.</p></details>';
  }

  /* ---------------- Simple helpers: next steps, share, compare ---------------- */
  function markDl() { try { localStorage.setItem('hisaab:dl', '1'); } catch (e) { /* ignore */ } }
  function flag(k) { try { return localStorage.getItem(k) === '1'; } catch (e) { return false; } }

  // What is left to make the profit exact: the open steps as actions, the finished ones as ticks.
  function stepsHtml() {
    if (S.demo) return '';
    var R = S.R, K = R.K, w = A.W(), exp = (w.expenses || []).length > 0;
    var steps = [
      { ok: !!S.H.legs, t: 'Add the Meesho payment report', why: 'Profit is worked out from it.', d: 'Payment report added', b: 'Upload', a: 'data-act="tab" data-tab="data"' },
      { ok: !R.missing.length, t: 'Add product cost for ' + pl(R.missing.length, 'SKU'), why: 'Without costs, profit looks higher than it really is.', d: 'Product costs added', b: 'Add costs', a: 'data-act="tab" data-tab="costs"' },
      { ok: !K.rdef || flag('hisaab:rv'), t: 'Check ' + pl(K.rdef, 'return') + ': resellable or not', why: 'Mark items that came back damaged, so your stock cost is right.', d: 'Returns checked', b: 'Check', a: 'data-act="rcgo" data-b="returned"' },

      '<div class="nx-ring" role="img" aria-label="' + done.length + ' of ' + steps.length + ' done"><svg viewBox="0 0 44 44"><defs><linearGradient id="nxg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b3fe6"/><stop offset="1" stop-color="#1faa59"/></linearGradient></defs>' +
      '<circle class="bg" cx="22" cy="22" r="18"/><circle class="fg" cx="22" cy="22" r="18" stroke-dasharray="' + f.toFixed(1) + ' ' + C + '"/></svg><b>' + done.length + '/' + steps.length + '</b></div>' +

  // Net profit of the month before the one shown, to show the change.

  function summaryText() {
    var R = S.R, K = R.K, st = A.cfg(), RV = S.RV, top = null;

  function shareSummary() {
    var text = summaryText();
    function wa() { window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener'); }

  A.summaryText = summaryText;
  A.shareSummary = shareSummary;
  A.markDl = markDl;

  // Shown in place of the full report when not logged in or not on Pro.
  function lockHtml(what) {
    var x = A.access(), trial = x.trialDays ? ' New accounts get ' + x.trialDays + ' days of Pro free.' : '';

      ? ['Every order with its Meesho payment, side by side', 'Payments overdue, recoveries and rows that do not add up', 'Mark each return or RTO as resellable or not', 'Search by order ID or SKU']

      : '<button class="btn pri" data-act="unlock" data-k="' + what + '">Get PakkaBill Pro</button>';
    var sk = '';

<script>
/* Hisaab exports: styled Excel workbook (xlsx-js-style) and PDF statement (jsPDF + autotable). */
(function () {
  'use strict';
  var HX = window.HX = {};

  function r(p) { return Math.round(p) / 100; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function inPer(S, p) { var d = S.per.basis === 'order' ? (p.od || p.pd) : p.pd; return !!d && d >= S.per.from && d <= S.per.to; }

  /* ================= Excel ================= */
  HX.xlsx = function (ctx) {
    var S = ctx.S, E = ctx.E, R = S.R, K = R.K, st = ctx.cfg, X = window.XLSX, per = S.per;
    var NUM = '#,##0.00;[Red](#,##0.00);"-"', INT = '0';
    var INK = '1B1F3B', CARBON = '2F3490', SOFT = 'E8E9F8', RULE = 'B9C1DD', RED = 'C8323A', GREY = '6F7599';
    var ST = {
      title: { font: { bold: true, sz: 15, color: { rgb: INK } } },
      sub: { font: { sz: 11, color: { rgb: GREY } } },
      head: { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { patternType: 'solid', fgColor: { rgb: CARBON } }, alignment: { vertical: 'center', wrapText: true } },
      sec: { font: { bold: true, color: { rgb: CARBON } }, fill: { patternType: 'solid', fgColor: { rgb: SOFT } } },
      row: { alignment: { indent: 1 } },
      tot: { font: { bold: true }, border: { top: { style: 'thin', color: { rgb: RULE } } } },
      gp: { font: { bold: true }, fill: { patternType: 'solid', fgColor: { rgb: SOFT } }, border: { top: { style: 'thin', color: { rgb: RULE } } } },
      np: { font: { bold: true, sz: 12 }, border: { top: { style: 'thin', color: { rgb: INK } }, bottom: { style: 'double', color: { rgb: RED } } } },
      bold: { font: { bold: true } },
      note: { font: { color: { rgb: GREY } }, alignment: { wrapText: true, vertical: 'top' } }

    function merge(a, b) {

    function t(v, s) { return { v: String(v == null ? '' : v), t: 's', s: s || undefined }; }

      var ws = {}, maxC = 0;

    var P = [];

    P.push([t('Generated'), t(today())]);

    P.push(heads(['Particulars', 'Amount (Rs)']));
    R.lines.forEach(function (l) {
      if (l.k === 'sec') P.push([t(l.l, ST.sec), t('', ST.sec)]);
      else if (l.k === 'row') P.push([t(l.l, ST.row), m(l.v)]);
      else { var s = ST[l.k === 'tot' || l.k === 'sub' ? 'tot' : l.k]; P.push([t(l.l, s), m(l.v, s)]); }
    });
    P.push([]);
    P.push([t('How profit ties to money received', ST.sec), t('', ST.sec)]);
    R.bridge.forEach(function (b) { var s = b.k === 'np' ? ST.np : b.k ? ST.tot : null; P.push([t(b.l, s || ST.row), m(b.v, s)]); });

    { art: 'meesho',
      en: ['Step 1: Download the payment report from Meesho', 'Open the Meesho Supplier Panel (supplier.meesho.com) and log in. In the left menu open Payments. Choose the dates you want, for example the last 2 or 3 months, and tap Download. You get an Excel file with sheets like Order Payments and Ads Cost. Download every month you need; the same row in two files is counted only once.'],
      hi: ['स्टेप 1: Meesho से payment report डाउनलोड करें', 'Meesho Supplier Panel (supplier.meesho.com) खोलें और लॉग इन करें। बाईं ओर के मेन्यू में Payments खोलें। तारीखें चुनें, जैसे पिछले 2 या 3 महीने, और Download दबाएँ। आपको एक Excel फ़ाइल मिलेगी जिसमें Order Payments और Ads Cost जैसी शीट होती हैं। जितने महीने चाहिए सब डाउनलोड करें; एक ही लाइन दो फ़ाइलों में हो तो भी एक बार ही गिनी जाती है।'] },
    { art: 'orders',
      en: ['Step 2 (optional): Download the orders report', 'In the Supplier Panel open Orders and download the orders file (CSV). It is optional, but it adds orders that Meesho has not paid for yet, so you can see pending and overdue payments in Reconcile.'],
      hi: ['स्टेप 2 (ज़रूरी नहीं): orders report डाउनलोड करें', 'Supplier Panel में Orders खोलें और orders फ़ाइल (CSV) डाउनलोड करें। यह ज़रूरी नहीं है, पर इससे वे ऑर्डर भी जुड़ जाते हैं जिनका पैसा Meesho ने अभी नहीं दिया, ताकि Reconcile में बाकी और देर वाले भुगतान दिख सकें।'] },
    { art: 'upload',
      en: ['Step 3: Upload the files here', 'Open the Upload tab and drop the files, or tap to choose them. You can add many files at once, even a zip. PakkaBill reads them on your device and checks that every row adds up to what Meesho paid.'],
      hi: ['स्टेप 3: फ़ाइलें यहाँ अपलोड करें', 'Upload टैब खोलें और फ़ाइलें डालें, या टैप करके चुनें। एक साथ कई फ़ाइलें, zip भी, डाल सकते हैं। PakkaBill इन्हें आपके डिवाइस पर ही पढ़ता है और जाँचता है कि हर लाइन Meesho के दिए पैसे से मिलती है।'] },
    { art: 'costs',
      en: ['Step 4: Enter your product costs', 'Open Costs. For each SKU type what ONE piece costs you (Per piece), how many pieces are in the pack (Pieces; a combo of 4 is 4) and the packing cost per parcel. Many SKUs? Use Fill automatically: the same cost for a category, a % of the selling price, copy from other sizes and colours, or paste SKU and cost from Excel. Without costs, profit looks higher than it really is.'],
      hi: ['स्टेप 4: प्रोडक्ट की लागत भरें', 'Costs खोलें। हर SKU के लिए एक पीस की लागत (Per piece), पैक में कितने पीस हैं (Pieces; 4 का combo = 4) और एक पार्सल की पैकिंग लागत भरें। बहुत सारे SKU हैं? Fill automatically इस्तेमाल करें: एक category के लिए एक ही लागत, बिक्री कीमत का %, दूसरे साइज़ और रंग से कॉपी, या Excel से SKU और लागत पेस्ट करें। लागत के बिना मुनाफ़ा असल से ज़्यादा दिखता है।'] },
    { art: 'settings',
      en: ['Step 5: Check expenses and settings', 'In Expenses add costs outside Meesho, like rent, salary or internet. In Settings: GST registered (yes if you have a GSTIN), Tax credits (claim TCS and TDS in your returns), and whether returned and RTO items usually go back into stock. Change these once; they apply to every report.'],
      hi: ['स्टेप 5: खर्चे और सेटिंग देखें', 'Expenses में Meesho के बाहर के खर्चे जोड़ें, जैसे किराया, सैलरी या इंटरनेट। Settings में: GST registered (GSTIN है तो हाँ), Tax credits (TCS और TDS आप रिटर्न में क्लेम करते हैं) और रिटर्न व RTO का माल आम तौर पर वापस स्टॉक में जाता है या नहीं। इन्हें एक बार सेट करें; हर रिपोर्ट पर लागू होंगे।'] },
    { art: 'read',
      en: ['Step 6: Read your P&L', 'Open P&L. At the top you see your real profit and margin. Choose the Period (all data, a month or your own dates). Count by payment date matches your bank; count by order date shows when you sold. The statement lists sales, returns, GST, cost of goods, every Meesho charge, ads and expenses down to net profit.'],
      hi: ['स्टेप 6: अपना P&L पढ़ें', 'P&L खोलें। ऊपर आपका असली मुनाफ़ा और मार्जिन दिखता है। Period चुनें (सारा डेटा, एक महीना या अपनी तारीखें)। Payment date से गिनती बैंक से मिलती है; Order date से गिनती बताती है कि आपने कब बेचा। स्टेटमेंट में बिक्री, रिटर्न, GST, माल की लागत, Meesho के सारे चार्ज, ads और खर्चे से लेकर शुद्ध मुनाफ़े तक सब है।'] },
    { art: 'returns',
      en: ['Step 7: Returns, RTO and best products', 'Below the statement: RTO, customer returns and exchanges, each with its rate and the money lost on it. Profit by category and Profit by SKU show which products earn and which lose. Break-even price is the lowest selling price where a SKU still makes no loss.'],
      hi: ['स्टेप 7: रिटर्न, RTO और सबसे अच्छे प्रोडक्ट', 'स्टेटमेंट के नीचे: RTO, कस्टमर रिटर्न और एक्सचेंज, हर एक की दर और उस पर हुआ नुकसान। Category और SKU के हिसाब से मुनाफ़ा बताता है कि कौन से प्रोडक्ट कमाते हैं और कौन से नुकसान करते हैं। Break-even price वह सबसे कम कीमत है जिस पर SKU में नुकसान नहीं होता।'] },
    { art: 'reconcile',
      en: ['Step 8: Reconcile every order', 'Reconcile lists every order: paid, awaiting payment, overdue, returned, RTO or cancelled. Raise a ticket with Meesho for overdue ones. When a returned or RTO item comes back damaged, mark it Not resellable so its cost counts as a loss.'],
      hi: ['स्टेप 8: हर ऑर्डर मिलाएँ', 'Reconcile में हर ऑर्डर दिखता है: पैसा मिला, बाकी है, देर हो गई, रिटर्न, RTO या कैंसल। देर वाले ऑर्डर के लिए Meesho पर टिकट डालें। रिटर्न या RTO का माल खराब लौटे तो उसे Not resellable मार्क करें, ताकि उसकी लागत नुकसान में गिनी जाए।'] },
    { art: 'download',
      en: ['Step 9: Download your report', 'On the P&L tab tap Download PDF for a clean PakkaBill report to share with your partner or accountant, or Download Excel for every detail in 12 sheets. Next month, just upload the new payment report; your costs and settings are remembered.'],
      hi: ['स्टेप 9: अपनी रिपोर्ट डाउनलोड करें', 'P&L टैब पर Download PDF दबाएँ, पार्टनर या CA को भेजने के लिए साफ़ PakkaBill रिपोर्ट मिलेगी; या Download Excel से 12 शीट में हर डिटेल। अगले महीने बस नई payment report अपलोड करें; आपकी लागत और सेटिंग याद रहती हैं।'] }
  ];

  /* ---------- what each option means ---------- */
  var TERMS = [
    ['Period', 'पीरियड', 'Which dates the P&L covers: all data, one month, or your own dates.', 'P&L कौन सी तारीखों का है: सारा डेटा, एक महीना या अपनी तारीखें।'],
    ['Count by payment date / order date', 'Payment date / Order date से गिनती', 'Payment date matches the money in your bank. Order date shows profit for orders placed in that period.', 'Payment date आपके बैंक में आए पैसे से मिलती है। Order date उस समय में आए ऑर्डर का मुनाफ़ा दिखाती है।'],
    ['Net sales', 'शुद्ध बिक्री', 'What buyers paid, less customer returns (includes GST).', 'ग्राहकों ने जो दिया, उसमें से रिटर्न घटाकर (GST सहित)।'],
    ['Net revenue', 'शुद्ध आय', 'Net sales without the GST you owe the government.', 'शुद्ध बिक्री में से सरकार को जाने वाला GST हटाकर।'],
    ['Cost of goods', 'माल की लागत', 'Your cost per piece × pieces shipped. Items back in stock are added back.', 'एक पीस की लागत × भेजे गए पीस। स्टॉक में लौटा माल वापस जोड़ा जाता है।'],
    ['Meesho charges', 'Meesho के चार्ज', 'Commission, shipping, return shipping, platform and other fees Meesho cut from your payout.', 'कमीशन, शिपिंग, रिटर्न शिपिंग, प्लेटफ़ॉर्म और बाकी फ़ीस जो Meesho ने भुगतान से काटी।'],
    ['TCS / TDS', 'TCS / TDS', 'Tax Meesho deducts: TCS under GST (0.5%), TDS under income tax (0.1%). You can claim both back.', 'Meesho जो टैक्स काटता है: GST में TCS (0.5%), इनकम टैक्स में TDS (0.1%)। दोनों वापस क्लेम कर सकते हैं।'],
    ['RTO', 'RTO', 'Return to origin: the parcel came back without being delivered.', 'Return to origin: पार्सल डिलीवर हुए बिना वापस आ गया।'],
    ['Customer return', 'कस्टमर रिटर्न', 'Delivered, then sent back by the buyer. Meesho takes the sale back and charges return shipping.', 'डिलीवर होने के बाद ग्राहक ने लौटाया। Meesho बिक्री वापस लेता है और रिटर्न शिपिंग चार्ज करता है।'],
    ['Exchange', 'एक्सचेंज', 'Delivered and swapped for another size or colour. It stays a sale.', 'डिलीवर होकर दूसरे साइज़ या रंग से बदला गया। यह बिक्री ही रहती है।'],
    ['Per piece / Pieces / Packing', 'Per piece / Pieces / Packing', 'Cost of one piece; pieces in one pack (combo); packing cost for one parcel.', 'एक पीस की लागत; एक पैक में पीस (combo); एक पार्सल की पैकिंग लागत।'],
    ['Category', 'कैटेगरी', 'Read from the Meesho product name. Change it in Costs if it is wrong.', 'Meesho के प्रोडक्ट नाम से पढ़ी जाती है। गलत हो तो Costs में बदलें।'],
    ['Break-even price', 'ब्रेक-ईवन कीमत', 'The selling price where a SKU makes zero profit. Red means you sell below it.', 'वह बिक्री कीमत जिस पर SKU में मुनाफ़ा शून्य है। लाल मतलब आप उससे कम में बेच रहे हैं।'],
    ['Not resellable', 'दोबारा बिकने लायक नहीं', 'A returned or RTO item that is damaged, used or wrong: its cost counts as a loss.', 'रिटर्न या RTO का माल जो खराब, इस्तेमाल हुआ या गलत है: उसकी लागत नुकसान में गिनी जाती है।']
  ];

  var UI = {
    en: { title: 'How to use Meesho P&L', sub: 'From Meesho download to your real profit, step by step.', play: '▶ Play guide', pause: '⏸ Pause', prev: '‹ Back', next: 'Next ›', of: 'of', terms: 'What each option means', try: 'Try with sample data', upload: 'Go to Upload', voice: 'Read aloud' },
    hi: { title: 'Meesho P&L कैसे इस्तेमाल करें', sub: 'Meesho से डाउनलोड से लेकर असली मुनाफ़े तक, स्टेप बाय स्टेप।', play: '▶ गाइड चलाएँ', pause: '⏸ रोकें', prev: '‹ पीछे', next: 'आगे ›', of: '/', terms: 'हर ऑप्शन का मतलब', try: 'सैंपल डेटा से देखें', upload: 'Upload पर जाएँ', voice: 'पढ़कर सुनाएँ' }
  };

  function speak(text) {
    try {
      if (!window.speechSynthesis) return false;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = G.lang === 'hi' ? 'hi-IN' : 'en-IN'; u.rate = G.lang === 'hi' ? 0.95 : 1;
      var vs = speechSynthesis.getVoices().filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf(G.lang === 'hi' ? 'hi' : 'en-in') === 0; });
      if (vs[0]) u.voice = vs[0];
      u.onend = function () { if (G.playing) G.timer = setTimeout(advance, 900); };
      speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }
  function stopVoice() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
  function advance() {
    if (!G.playing) return;
    if (G.i >= STEPS.length - 1) { G.playing = false; draw(); return; }
    G.i++; draw(); sayStep();
  }
  function sayStep() {
    clearTimeout(G.timer);
    var s = STEPS[G.i][G.lang];
    if (!speak(s[0] + '. ' + s[1])) G.timer = setTimeout(advance, Math.max(6000, s[1].length * 55)); // no voice: move on after reading time
  }

  V.guide = function () {
    var u = UI[G.lang], s = STEPS[G.i], t = s[G.lang];
    var dots = STEPS.map(function (x, i) { return '<button class="g-dot' + (i === G.i ? ' on' : '') + '" data-g="go" data-i="' + i + '" aria-label="' + (i + 1) + '"></button>'; }).join('');
    var h = '<section class="sheet g-top"><div class="g-head"><div><h2>' + esc(u.title) + '</h2><p class="muted" style="margin:2px 0 0">' + esc(u.sub) + '</p></div>' +
      '<div class="seg" role="group" aria-label="Language"><button data-g="lang" data-v="en" aria-pressed="' + (G.lang === 'en') + '">English</button><button data-g="lang" data-v="hi" aria-pressed="' + (G.lang === 'hi') + '">हिंदी</button></div></div></section>';
    h += '<section class="sheet g-card"><div class="g-art">' + ART[s.art] + '</div><div class="g-body"><p class="g-num">' + (G.i + 1) + ' ' + u.of + ' ' + STEPS.length + '</p><h3>' + esc(t[0]) + '</h3><p>' + esc(t[1]) + '</p></div>' +
      '<div class="g-bar"><div class="g-prog"><i style="width:' + ((G.i + 1) * 100 / STEPS.length).toFixed(1) + '%"></i></div>' +
      '<div class="g-ctl"><button class="btn sm" data-g="prev"' + (G.i === 0 ? ' disabled' : '') + '>' + esc(u.prev) + '</button>' +
      '<button class="btn pri" data-g="play">' + esc(G.playing ? u.pause : u.play) + '</button>' +
      '<button class="btn sm" data-g="next"' + (G.i === STEPS.length - 1 ? ' disabled' : '') + '>' + esc(u.next) + '</button></div><div class="g-dots">' + dots + '</div></div></section>';
    h += '<section class="sheet"><div class="row"><button class="btn" data-act="tab" data-tab="data">' + esc(u.upload) + '</button>' + (A.hasData() ? '' : '<button class="btn" data-act="demo">' + esc(u.try) + '</button>') + '</div></section>';
    h += '<details class="sheet more"' + (G.i === STEPS.length - 1 ? ' open' : '') + '><summary>' + esc(u.terms) + '</summary><dl class="g-terms">' + TERMS.map(function (x) {
      return '<dt>' + esc(G.lang === 'hi' ? x[1] : x[0]) + '</dt><dd>' + esc(G.lang === 'hi' ? x[3] : x[2]) + '</dd>';
    }).join('') + '</dl></details>';
    return '<div class="stack">' + h + '</div>';
  };
  function draw() { if (S.tab === 'guide') A.render(); }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-g]'); if (!b) return;
    var k = b.getAttribute('data-g');
    if (k === 'lang') { if (A.setLang) A.setLang(b.getAttribute('data-v')); else { G.lang = b.getAttribute('data-v'); draw(); } if (G.playing) sayStep(); return; }
    if (k === 'play') { G.playing = !G.playing; if (G.playing) { if (G.i === STEPS.length - 1) G.i = 0; draw(); sayStep(); } else { clearTimeout(G.timer); stopVoice(); draw(); } return; }
    clearTimeout(G.timer); stopVoice();
    if (k === 'next' && G.i < STEPS.length - 1) G.i++;
    else if (k === 'prev' && G.i > 0) G.i--;
    else if (k === 'go') G.i = +b.getAttribute('data-i') || 0;
    draw(); if (G.playing) sayStep();
  });
  // leaving the guide stops the voice
  document.addEventListener('click', function (e) { var t = e.target.closest('[data-act="tab"]'); if (t && t.getAttribute('data-tab') !== 'guide') { G.playing = false; clearTimeout(G.timer); stopVoice(); } }, true);
  A.guideLang = function () { return G.lang; };
  A.guideSetLang = function (l) { G.lang = l === 'hi' ? 'hi' : 'en'; };
})();
</script>
<script>try { if (localStorage.getItem('hisaab:lang') === 'hi') document.write('<script src="pnl-hi.js"><\/script>'); } catch (e) { /* ignore */ }</script>
<script>HA.boot();</script>
</body>
</html>
