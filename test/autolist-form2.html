<!doctype html>
<!-- A second stand-in for Meesho's form, for test/autolist-browser.js: sizes are buttons on the form
     (no drop-down), the form says XXL where the template says 2XL, each size's boxes are in a card
     (no table), and one Returns Price box is for all sizes. -->
<html><head><meta charset="utf-8"><title>Form 2</title>
<style>body{font:14px sans-serif;padding:20px}.chip{display:inline-block;border:1px solid #999;padding:4px 10px;margin:2px;cursor:pointer}.chip.selected{background:#cde}.card{border:1px solid #ccc;margin:6px 0;padding:6px}.fld{margin:4px 0}</style>
</head><body>
<form onsubmit="window.SUBMITTED=1;return false">
  <div class="fld"><label>Product Name</label><div><input name="pn"></div></div>
  <div class="fld"><div class="ttl">Select Sizes *</div><div class="chips" id="chips"></div></div>
  <div class="fld"><label>Wrong/Defective Returns Price</label><div><input name="rp"></div></div>
  <div id="cards"></div>
  <button type="submit">Submit</button>
</form>
<script>
const SZ = ['S', 'M', 'L', 'XL', 'XXL'], picked = [];
const chips = document.getElementById('chips');
SZ.forEach(z => {
  const c = document.createElement('span'); c.className = 'chip'; c.textContent = z;
  c.addEventListener('click', () => {
    const i = picked.indexOf(z); if (i >= 0) picked.splice(i, 1); else picked.push(z);
    c.classList.toggle('selected', i < 0);
    clearTimeout(window.t); window.t = setTimeout(draw, 300); // the page takes a moment to add the cards
  });
  chips.appendChild(c);
});
function draw() {
  document.getElementById('cards').innerHTML = SZ.filter(z => picked.includes(z)).map(z => `<div class="card"><h4>Size: ${z}</h4>
    <div class="fld"><label>Meesho Price *</label><div><input data-z="${z}" data-k="price"></div></div>
    <div class="fld"><label>MRP *</label><div><input data-z="${z}" data-k="mrp"></div></div>
    <div class="fld"><label>Inventory *</label><div><input data-z="${z}" data-k="stock"></div></div>
    <div class="fld"><label>Supplier SKU ID</label><div><input data-z="${z}" data-k="sku"></div></div></div>`).join('');
}
</script></body></html>
