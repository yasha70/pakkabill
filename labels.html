<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">

<title>PakkaBill: Meesho labels and packing chart</title>
<meta name="description" content="Packing chart from the Meesho manifest (blouse sizes as L, XL, XXL), Meesho labels sorted by SKU and size, and one PDF to print. Free, and your files never leave your phone or computer.">

<style>
:root {
  --paper: #fdf8f3; --sheet: #FFFFFF; --rule: #e2daf2; --rule-2: #cfc4ea;
  --ink: #2a2540; --ink-2: #5c5776; --ink-3: #736e8d;
  --carbon: #5b3fe6; --carbon-ink: #FFFFFF; --carbon-soft: #ece6ff;
  --neg: #c8202a; --pos: #12714b; --pos-bg: #e6f6ee; --warn: #8a5200; --warn-bg: #fff4df; --focus: #ff7a59;
  --f-head: "Anek Latin", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing: border-box; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #110e20; --sheet: #1b1631; --rule: #3a3160; --rule-2: #4a4078;
    --ink: #ece8fb; --ink-2: #bdb5d9; --ink-3: #958db3;
    --carbon: #b3a1ff; --carbon-ink: #140c33; --carbon-soft: #35295e;
    --neg: #ff8a8f; --pos: #74d8a7; --pos-bg: #15302a; --warn: #f0c26a; --warn-bg: #2b2410; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #110e20; --sheet: #1b1631; --rule: #3a3160; --rule-2: #4a4078;
  --ink: #ece8fb; --ink-2: #bdb5d9; --ink-3: #958db3;
  --carbon: #b3a1ff; --carbon-ink: #140c33; --carbon-soft: #35295e;
  --neg: #ff8a8f; --pos: #74d8a7; --pos-bg: #15302a; --warn: #f0c26a; --warn-bg: #2b2410; color-scheme: dark;
}
:root.pbfonts { --f-head: "PB Hind", "Hind", system-ui, -apple-system, "Segoe UI", sans-serif; --f-body: "PB Hind", "Hind", system-ui, -apple-system, "Segoe UI", sans-serif; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--f-body); font-variant-numeric: tabular-nums; padding-bottom: env(safe-area-inset-bottom, 0px); }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.2; margin: 0; }
h2 { font-size: 1.2rem; }
a { color: var(--carbon); }
button, input, select { font: inherit; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.band { background: #2f3490; color: #fff; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; }
.band-in { max-width: 920px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.band a { color: #fff; font-weight: 700; text-decoration: none; }
.band .brand { font-family: var(--f-head); font-size: 1.25rem; }
.band .back { margin-left: auto; font-size: .9rem; opacity: .9; text-decoration: underline; text-underline-offset: 3px; }
.embed .band { display: none; }

.wrap { max-width: 920px; margin: 0 auto; padding: 16px 16px 40px; display: grid; gap: 16px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 18px; min-width: 0; }
.card > h2 { margin-bottom: 10px; }
.sub { color: var(--ink-2); font-size: .93rem; margin: 4px 0 0; }
.fine { color: var(--ink-3); font-size: .85rem; }

.hero { position: relative; overflow: hidden; border-radius: 18px; padding: 22px 20px 20px; color: #fff; background: linear-gradient(125deg, #26307f 0%, #4b3bd6 52%, #7c56ee 100%); box-shadow: 0 14px 36px -22px rgba(40, 30, 140, .8); }
.hero::after { content: ""; position: absolute; right: -70px; top: -90px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 122, 89, .5), rgba(255, 122, 89, 0) 70%); pointer-events: none; }
.hero-top { position: relative; z-index: 1; display: flex; align-items: flex-start; gap: 12px; }
.hero-k { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 8px; padding: 3px 10px 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, .14); font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.hero-k i { width: 7px; height: 7px; border-radius: 50%; background: #5cf2a6; box-shadow: 0 0 0 3px rgba(92, 242, 166, .25); }
.hero h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.08; letter-spacing: -.01em; }
.hero p { position: relative; z-index: 1; margin: 8px 0 0; max-width: 560px; opacity: .92; font-size: .97rem; }
.lang { margin-left: auto; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, .16); flex: none; }
.lang button { border: 0; background: none; color: #fff; border-radius: 999px; padding: 4px 11px; font-weight: 700; font-size: .85rem; cursor: pointer; min-height: 30px; }
.lang button[aria-pressed="true"] { background: #fff; color: #2f2a8a; }
.steps { position: relative; z-index: 1; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 14px 0 0; padding: 0; font-size: .84rem; font-weight: 600; }
.steps li { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .13); border-radius: 999px; padding: 4px 11px 4px 5px; }
.steps b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #fff; color: #3b2fb0; font-size: .75rem; }

.drop { display: block; border: 2px dashed var(--rule-2); border-radius: 14px; padding: 24px 16px; text-align: center; cursor: pointer; background: var(--paper); transition: border-color .12s, background .12s; }
.drop:hover, .drop.over { border-color: var(--carbon); background: var(--carbon-soft); }
.drop:focus-within { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.drop svg { width: 38px; height: 38px; color: var(--carbon); }
.drop b { display: block; font-family: var(--f-head); font-size: 1.15rem; margin-top: 6px; }
.drop span { display: block; color: var(--ink-2); font-size: .9rem; margin-top: 2px; }
.files { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.files li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 12px; background: var(--paper); min-width: 0; }
.files .fi { width: 34px; height: 34px; border-radius: 9px; background: var(--carbon-soft); color: var(--carbon); display: grid; place-items: center; flex: none; }
.files .fi svg { width: 18px; height: 18px; }
.files .fn { min-width: 0; flex: 1; }
.files .fn b { display: block; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files .fn span { display: block; font-size: .83rem; color: var(--ink-2); }
.x { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink-2); cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.x:hover { color: var(--neg); border-color: var(--neg); }

.busy { display: grid; gap: 8px; }
.bar { height: 8px; border-radius: 99px; background: var(--carbon-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--carbon); border-radius: 99px; transition: width .15s; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; background: var(--paper); min-width: 0; }
.tile span { display: block; font-size: .8rem; color: var(--ink-2); font-weight: 600; }
.tile b { display: block; font-family: var(--f-head); font-size: 1.6rem; line-height: 1.15; }
@media (width < 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.note { border-left: 3px solid var(--warn); background: var(--warn-bg); padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: .93rem; margin-top: 12px; }
.note.ok { border-left-color: var(--pos); background: var(--pos-bg); }
.note.info { border-left-color: var(--carbon); background: var(--carbon-soft); }
.note b { display: block; }
.note ul { margin: 6px 0 0; padding-left: 18px; }
.note li { word-break: break-word; }

.opts { display: grid; gap: 14px; }
.opt > .lbl { display: block; font-weight: 700; font-size: .92rem; margin-bottom: 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1.5px solid var(--rule-2); background: var(--sheet); color: var(--ink); border-radius: 10px; padding: 7px 12px; min-height: 40px; font-weight: 600; font-size: .92rem; cursor: pointer; text-align: left; }
.seg button small { display: block; font-weight: 400; color: var(--ink-2); font-size: .78rem; }
.seg button[aria-pressed="true"] { border-color: var(--carbon); background: var(--carbon-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--carbon); }
.seg button[disabled] { opacity: .5; cursor: not-allowed; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: .95rem; cursor: pointer; }
.chk input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--carbon); flex: none; }
.chk small { display: block; color: var(--ink-2); font-size: .82rem; }

.acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--rule-2); background: var(--sheet); font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--carbon); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.pri { background: var(--carbon); border-color: var(--carbon); color: var(--carbon-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.big { min-height: 50px; padding: 10px 20px; font-size: 1.02rem; }
.btn[disabled] { opacity: .55; cursor: progress; }
.done { margin-top: 12px; }
.thumbs { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; margin-top: 10px; }
.thumbs figure { margin: 0; flex: none; text-align: center; font-size: .78rem; color: var(--ink-2); }
.thumbs canvas { display: block; border: 1px solid var(--rule-2); border-radius: 6px; background: #fff; box-shadow: 0 6px 16px -12px rgba(30, 20, 90, .6); }

.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs button { border: 0; background: var(--paper); border: 1px solid var(--rule); color: var(--ink-2); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: .9rem; cursor: pointer; min-height: 36px; }
.tabs button[aria-pressed="true"] { background: var(--carbon); border-color: var(--carbon); color: var(--carbon-ink); }
.tw { overflow-x: auto; border: 1px solid var(--rule); border-radius: 12px; }
table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.t th, table.t td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.t th { background: var(--paper); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); white-space: nowrap; position: sticky; top: 0; }
table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }
table.t .grp td { background: var(--carbon-soft); font-weight: 700; font-size: .85rem; }
table.chart td.n, table.chart th.n { text-align: center; min-width: 3.2em; }
table.chart td.z { color: var(--ink-3); opacity: .55; }
table.chart td.n:last-child, table.chart th.n:last-child { text-align: right; }
table.chart .grand td { background: var(--carbon-soft); font-weight: 800; border-top: 2px solid var(--rule-2); }
.chips button small { font-weight: 600; opacity: .75; }
@media (width < 560px) { table.chart th, table.chart td { padding: 8px 5px; font-size: .86rem; } table.chart td.n, table.chart th.n { min-width: 2.3em; } table.chart th:first-child, table.chart td:first-child { padding-left: 9px; } }
table.t .tot td { font-weight: 700; color: var(--ink-2); font-size: .85rem; }
table.t .sku { font-weight: 700; overflow-wrap: anywhere; }
table.t .on { display: block; font-size: .8rem; font-weight: 400; color: var(--ink-2); word-break: break-all; }
table.ord td:nth-child(2) { width: 64%; }
table.ord td:nth-child(3) { overflow-wrap: anywhere; }
.pill { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: .75rem; font-weight: 700; background: var(--carbon-soft); color: var(--carbon); white-space: nowrap; }
.pill.w { background: var(--warn-bg); color: var(--warn); }
.more { padding: 8px 12px; font-size: .85rem; color: var(--ink-2); }

.how ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.how .priv { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: var(--pos-bg); font-size: .92rem; }
.how .priv svg { width: 20px; height: 20px; color: var(--pos); flex: none; margin-top: 2px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #1b1631; color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: .92rem; z-index: 10; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .5); max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
/* PakkaBill label engine: reads the text of Meesho shipping labels and the manifest, and sorts the
   labels. No browser APIs here, so test/labels-audit.js can run it in Node. */
(function (root) {
  'use strict';

  /* ---------------- reading a label ---------------- */
  var COURIERS = [['Valmo', /\bvalmo\b/i], ['Delhivery', /\bdelhivery\b/i], ['Xpress Bees', /xpress\s*bees/i], ['Ecom Express', /ecom\s*express/i],
    ['Shadowfax', /shadow\s*fax/i], ['Ekart', /\bekart\b/i], ['DTDC', /\bdtdc\b/i], ['Blue Dart', /blue\s*dart/i], ['Amazon Shipping', /amazon\s*(shipping|transportation)/i],
    ['India Post', /india\s*post|speed\s*post/i], ['Smartr', /\bsmartr\b/i], ['Elastic Run', /elastic\s*run/i], ['Loadshare', /load\s*share/i],
    ['Shree Maruti', /shree\s*maruti/i], ['Gati', /\bgati\b/i], ['Shiprocket', /\bshiprocket\b/i]];
  var KEY = { sku: 'sku', skuid: 'sku', skucode: 'sku', size: 'size', qty: 'qty', quantity: 'qty', total: 'qty', color: 'color', colour: 'color',
    order: 'order', orderno: 'order', orderid: 'order', suborder: 'order', sub: 'order', s: 'sn', sno: 'sn', sr: 'sn', srno: 'sn', serial: 'sn',
    awb: 'awb', awbno: 'awb', tracking: 'awb', packed: 'packed' };
  var STOP = /tax\s*invoice|\binvoice\b|bill\s*to|ship\s*to|sold\s*by|original\s*for|bill\s*of\s*supply/i;
  var GSTIN = /^\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]$/;
  var SEP = String.fromCharCode(1);

  // pdf.js text items -> words with positions (PDF points, y grows upwards)
  function words(items) {
    var out = [];
    (items || []).forEach(function (it) {
      var str = it && it.str; if (!str || !/\S/.test(str)) return;
      var tr = it.transform || [1, 0, 0, 1, 0, 0];
      var h = Math.hypot(tr[2], tr[3]) || it.height || 8, x = tr[4], y = tr[5];
      // where each word sits inside a longer run of text: rough Helvetica widths per character
      var cum = [0], tot = 0;
      for (var i = 0; i < str.length; i++) { tot += charW(str.charAt(i)); cum.push(tot); }
      var w = it.width || tot * h, re = /\S+/g, m;
      while ((m = re.exec(str))) out.push({ s: m[0], x: x + w * cum[m.index] / tot, w: w * (cum[m.index + m[0].length] - cum[m.index]) / tot, y: y, h: h });
    });
    return out;
  }
  function charW(c) { return c === ' ' ? 0.28 : /[A-Z]/.test(c) ? (c === 'I' ? 0.28 : /[MW]/.test(c) ? 0.85 : 0.68) : /[a-z]/.test(c) ? (/[iljtf]/.test(c) ? 0.26 : /[mw]/.test(c) ? 0.8 : 0.53) : /\d/.test(c) ? 0.56 : 0.33; }
  // words -> lines, top to bottom, each line left to right
  function lines(ws) {
    var a = ws.slice().sort(function (p, q) { return q.y - p.y || p.x - q.x; }), out = [], cur = null;
    a.forEach(function (w) {
      if (cur && Math.abs(w.y - cur.y) <= Math.max(1.5, 0.45 * Math.min(w.h, cur.h))) { cur.words.push(w); cur.h = Math.max(cur.h, w.h); }
      else { cur = { y: w.y, h: w.h, words: [w] }; out.push(cur); }
    });
    out.forEach(function (l) { l.words.sort(function (p, q) { return p.x - q.x; }); l.text = l.words.map(function (w) { return w.s; }).join(' '); });
    return out;
  }
  // a heading word on its own ("SKU", "Order", "Qty:"), never a value such as "SKU-7" or "SKU123"
  function keyOf(s) { var w = String(s).toLowerCase().replace(/[.:#]+$/, ''); return /^[a-z]+(-[a-z]+)*$/.test(w) ? KEY[w.replace(/-/g, '')] || null : null; }
  function cleanTok(s) { return String(s).replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9_]+$/g, '').toUpperCase(); }
  function digits(s) { return (String(s).match(/\d/g) || []).length; }
  function isTrackId(s) { return /^[A-Z0-9]{9,24}$/.test(s) && digits(s) >= 6 && !GSTIN.test(s); }

  // The heading line of a table (the first line with headings that pass `test`); columns from its words.
  function findHead(ls, test) {
    for (var i = 0; i < ls.length; i++) {
      var ks = {}, cs = [];
      ls[i].words.forEach(function (w) {
        var k = keyOf(w.s);
        if (k && !ks[k]) { ks[k] = 1; cs.push({ k: k, x0: w.x, x1: w.x + w.w }); }
        else if (cs.length) cs[cs.length - 1].x1 = Math.max(cs[cs.length - 1].x1, w.x + w.w); // "No." after "Order"
      });
      if (test(ks)) return { i: i, cols: cs, ks: ks };
    }
    return null;
  }
  var isItemHead = function (ks) { return ks.sku && (ks.size || ks.qty); };
  // the column a word belongs to: the heading it sits under, or the nearest one
  function colOf(w, cols) {
    var a = w.x, b = w.x + w.w, best = 0, bd = Infinity, bo = -1;
    cols.forEach(function (c, j) {
      var ov = Math.min(b, c.x1) - Math.max(a, c.x0), d = ov > 0 ? 0 : Math.max(c.x0 - b, a - c.x1);
      if (d < bd - 0.01 || (Math.abs(d - bd) <= 0.01 && ov > bo)) { bd = d; bo = ov; best = j; }
    });
    return cols[best].k;
  }
  function cellsOf(L, cols) {
    var cell = {};
    L.words.forEach(function (w) { var k = colOf(w, cols); cell[k] = cell[k] ? cell[k] + ' ' + w.s : w.s; });
    return cell;
  }
  function joinSku(a, b) { return a + (/[-_/(]$/.test(a) || /^[-_/)]/.test(b) ? '' : ' ') + b; }

  // The "Product Details" table on a Meesho label: SKU | Size | Qty | Color | Order No.
  function parseLabel(ls) {
    var h = findHead(ls, isItemHead);
    if (!h) return kvLabel(ls);
    var hi = h.i, cols = h.cols, head = ls[hi];
    var rows = [], prevY = head.y, lastY = head.y, end = hi;
    for (var j = hi + 1; j < ls.length && j <= hi + 30; j++) {
      var L = ls[j];
      if (prevY - L.y > Math.max(3 * head.h, 30)) break;
      if (STOP.test(L.text)) break;
      if (L.words.some(function (w) { return keyOf(w.s) === 'sku'; })) break;
      var cell = cellsOf(L, cols);
      var hasQ = cols.some(function (c) { return c.k === 'qty'; });
      if (cell.sku && (!hasQ || /\d/.test(cell.qty || '') || cell.order)) {
        rows.push({ sku: cell.sku, size: cell.size || '', qty: cell.qty || '', color: cell.color || '', order: cell.order || '' });
      } else if (rows.length) {
        var r = rows[rows.length - 1];
        if (cell.sku) r.sku = joinSku(r.sku, cell.sku);
        if (cell.size) r.size += ' ' + cell.size;
        if (cell.color) r.color += ' ' + cell.color;
        if (cell.order) r.order += cell.order;
        if (cell.qty && !r.qty) r.qty = cell.qty;
      } else break;
      prevY = L.y; lastY = L.y; end = j;
    }
    rows = rows.map(fixRow).filter(function (r) { return r.sku; });
    if (!rows.length) return { ok: false, why: 'table' };
    var cutY = null;
    for (var k = end + 1; k < ls.length; k++) if (STOP.test(ls[k].text)) { cutY = ls[k].y + ls[k].h * 0.95; break; }
    return finish({ ok: true, rows: rows, headY: head.y + head.h, lastY: lastY, cutY: cutY }, ls);
  }
  // fallback for labels written as "SKU: ABC  Size: M  Qty: 1"

  });
  // files dropped anywhere on the page are added (and never open in the browser instead)
  ['dragenter', 'dragover'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); var d = $('#drop'); if (d) d.classList.add('over'); }); });
  document.addEventListener('dragleave', function (e) { if (!e.relatedTarget) { var d = $('#drop'); if (d) d.classList.remove('over'); } });
  document.addEventListener('drop', function (e) { e.preventDefault(); var d = $('#drop'); if (d) d.classList.remove('over'); addFiles(e.dataTransfer && e.dataTransfer.files); });

  /* ---------------- inside PakkaBill: follow its colours and fonts ---------------- */
  (function () {
    var pd = null; try { pd = window.parent && window.parent !== window ? window.parent.document : null; } catch (e) { pd = null; }
    if (!pd) return;
    var sync = function () { var th = pd.documentElement.getAttribute('data-theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); else document.documentElement.removeAttribute('data-theme'); };
    sync(); try { new MutationObserver(sync).observe(pd.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) { /* ignore */ }
    try {
      var css = '';
      for (var i = 0; i < pd.styleSheets.length; i++) { var rs; try { rs = pd.styleSheets[i].cssRules; } catch (e) { continue; } for (var j = 0; j < rs.length; j++) if (rs[j].type === 5 && /PB Hind/.test(rs[j].cssText)) css += rs[j].cssText + '\n'; }
      if (css) { var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st); document.documentElement.classList.add('pbfonts'); }
    } catch (e) { /* ignore */ }
  })();
  if (!document.documentElement.classList.contains('embed')) { try { var th = localStorage.getItem('pb-theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) { /* ignore */ } }

  render();
})();
</script>
